# Knowledge Portal Architecture Descriptor (Declarative Blueprint)
title: "Knowledge Portal Architecture"
description: "Universal AST Knowledge Engine and Interactive Documentation Topology"

layers:
  - id: "client"
    name: "Layer 1: Presentation and Web Shell"
    color: "#38bdf8"
    services:
      - id: "dashboard"
        name: "Dashboard Shell"
        desc: "Adaptive SPA shell with dynamic view detection"
        status: "active"
      - id: "graph-2d"
        name: "Vis.js 2D Network"
        desc: "Physics-based organic AST network graph with radar minimap"
        status: "active"
      - id: "graph-3d"
        name: "Three.js WebGL"
        desc: "3D force-directed layout and volumetric viewer with fly-to"
        status: "active"
      - id: "db-lineage"
        name: "DB Lineage Explorer"
        desc: "Interactive SQL catalog and FK dependency map with DDL/JOIN"
        status: "active"

  - id: "engine"
    name: "Layer 2: Core Analysis and AST Engine"
    color: "#8b5cf6"
    services:
      - id: "polyglot"
        name: "Polyglot AST Scanner"
        desc: "10-language native parser with AI process flow bridge"
        status: "active"
      - id: "search-indexer"
        name: "Omni-Search Indexer"
        desc: "Deep document and symbol token search indexer"
        status: "active"
      - id: "floorplan-gen"
        name: "Floorplan Generator"
        desc: "Zero-dependency declarative SVG vector compiler"
        status: "active"

  - id: "distribution"
    name: "Layer 3: Delivery and Serving Modes"
    color: "#10b981"
    services:
      - id: "server"
        name: "HTTP Dev Server"
        desc: "Python stdlib HTTP server with SSE live-reload"
        status: "active"
      - id: "exporter"
        name: "Static Exporter"
        desc: "Zero-server offline bundle generator for GitHub Pages"
        status: "active"
      - id: "docker"
        name: "GHCR Container"
        desc: "Alpine-based multi-arch secure container image"
        status: "active"

connections:
  - from: "client"
    to: "engine"
  - from: "engine"
    to: "distribution"
