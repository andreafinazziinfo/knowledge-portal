<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Packing — Hierarchical Architecture</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <script src="../data/graph_labels.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
    #cp-stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #cp-hud {
      position: absolute; top: 14px; left: 14px; z-index: 20;
      background: rgba(20, 20, 20, 0.9); border: 1px solid #2b2b2b; border-radius: 10px;
      padding: 10px 14px; font-size: 12px; color: #d4d4d8;
    }
    #cp-hud strong { color: #ffffff; }
    #cp-tip {
      position: fixed; pointer-events: none; z-index: 40; display: none;
      background: #171717; border: 1px solid #404040; border-radius: 6px;
      padding: 6px 10px; font-size: 11px; color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="cp-hud">
    <strong>Zoomable Circle Packing</strong><br>
    <span style="font-size:11px; color:#9ca3af;">Click any folder circle to zoom in · Click background to zoom out</span>
  </div>
  <div id="cp-stage"></div>
  <div id="cp-tip"></div>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const PALETTE = ['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#22d3ee','#f472b6','#a3e635','#fb923c','#818cf8','#2dd4bf','#facc15','#fb7185','#c084fc','#60a5fa'];
    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [] };
    const nodes = raw.nodes || [];
    const rootObj = { name: 'Codebase', children: [] };
    const folderMap = new Map([['', rootObj]]);

    for (const n of nodes) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      const parts = p.split('/').filter(Boolean);
      let cur = '', parent = rootObj;
      for (let i = 0; i < parts.length; i++) {
        const seg = parts[i];
        const next = cur ? cur + '/' + seg : seg;
        if (i === parts.length - 1) {
          parent.children.push({ name: seg, value: Math.max(1, n.degree || 1), color: n.color || PALETTE[(n.community || 0) % PALETTE.length], path: p });
        } else {
          if (!folderMap.has(next)) {
            const f = { name: seg, children: [], color: n.color || PALETTE[(n.community || 0) % PALETTE.length] };
            folderMap.set(next, f);
            parent.children.push(f);
          }
          parent = folderMap.get(next);
        }
        cur = next;
      }
    }

    const size = Math.min(window.innerWidth, window.innerHeight) - 20;
    const root = d3.pack().size([size, size]).padding(3)(
      d3.hierarchy(rootObj).sum(d => d.value || 1).sort((a, b) => b.value - a.value)
    );

    const tip = document.getElementById('cp-tip');
    let focus = root, view;
    const svg = d3.select('#cp-stage').append('svg')
      .attr('viewBox', `-${size / 2} -${size / 2} ${size} ${size}`)
      .style('width', size + 'px').style('height', size + 'px').style('cursor', 'pointer')
      .on('click', (ev) => zoom(ev, root));

    const node = svg.append('g').selectAll('circle').data(root.descendants().slice(1)).join('circle')
      .attr('fill', d => d.children ? 'rgba(255,255,255,0.04)' : (d.data.color || '#38bdf8'))
      .attr('fill-opacity', d => d.children ? 1 : 0.72)
      .attr('stroke', d => d.children ? (d.data.color || '#404040') : '#0f0f0f')
      .attr('stroke-width', d => d.children ? 1.1 : 0.5)
      .on('mousemove', (ev, d) => {
        tip.style.display = 'block';
        tip.style.left = (ev.clientX + 12) + 'px';
        tip.style.top = (ev.clientY - 10) + 'px';
        tip.textContent = `${d.data.path || d.data.name} (${d.value})`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; })
      .on('click', (ev, d) => { if (focus !== d) { zoom(ev, d); ev.stopPropagation(); } });

    const label = svg.append('g').attr('pointer-events', 'none').attr('text-anchor', 'middle')
      .selectAll('text').data(root.descendants()).join('text')
      .style('fill', '#f3f4f6').style('font-size', '11px').style('font-weight', '600')
      .style('fill-opacity', d => d.parent === root ? 1 : 0)
      .style('display', d => d.parent === root ? 'inline' : 'none')
      .text(d => d.data.name);

    function zoomTo(v) {
      const k = size / v[2];
      view = v;
      label.attr('transform', d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`);
      node.attr('transform', d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`).attr('r', d => d.r * k);
    }

    function zoom(ev, d) {
      focus = d;
      const tr = svg.transition().duration(550).tween('zoom', () => {
        const i = d3.interpolateZoom(view, [focus.x, focus.y, focus.r * 2]);
        return t => zoomTo(i(t));
      });
      label.filter(function (n) { return n.parent === focus || this.style.display === 'inline'; })
        .transition(tr)
        .style('fill-opacity', n => n.parent === focus ? 1 : 0)
        .on('start', function (n) { if (n.parent === focus) this.style.display = 'inline'; })
        .on('end', function (n) { if (n.parent !== focus) this.style.display = 'none'; });
    }

    zoomTo([root.x, root.y, root.r * 2]);
  })();
  </script>
</body>
</html>
