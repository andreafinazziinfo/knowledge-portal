<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graphify 3D Canvas Panels</title>
<script src="../assets/3d-force-graph.min.js"></script>
<script>if (typeof ForceGraph3D === "undefined") { document.write('<script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"><\/script>'); }</script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #fff; font-family: sans-serif; overflow: hidden; }
  #3d-canvas { width: 100vw; height: 100vh; }
  #hud { position: absolute; top: 14px; left: 14px; background: rgba(26, 26, 26, 0.86); backdrop-filter: blur(8px); border: 1px solid #232323; padding: 10px 14px; border-radius: 6px; font-size: 12px; color: #ececec; z-index: 10; font-weight: 600; }
  #legend { position: absolute; top: 54px; right: 14px; max-height: 70vh; overflow-y: auto; background: rgba(26, 26, 26, 0.86); backdrop-filter: blur(8px); border: 1px solid #232323; padding: 10px 12px; border-radius: 6px; font-size: 11px; z-index: 10; width: 200px; }
  #legend h3 { font-size: 10px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ececec; }
</style>
  <script src="live-reload.js"></script>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script defer src="portal-ui.js?v=fp3"></script>
</head>
<body>
<div id="hud">🎨 3D Canvas Panels Grid</div>
<div id="legend"><h3>Communities</h3><div id="legend-list">Loading...</div></div>
<div id="3d-canvas"></div>
<script>
  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [] };
  }

  window.addEventListener('DOMContentLoaded', () => {
    const raw = getVizData();
    const allNodes = raw.nodes || [];
    const labelsMap = raw.labels || window.GRAPH_LABELS || {};

    const commCounts = {};
    const commColor = {};
    allNodes.forEach(n => {
      const cid = n.community || 0;
      commCounts[cid] = (commCounts[cid] || 0) + 1;
      if (!commColor[cid] && n.color) commColor[cid] = n.color;
    });
    const sortedCommIds = Object.keys(commCounts).map(Number).sort((a, b) => commCounts[b] - commCounts[a]);
    const legendList = document.getElementById('legend-list');
    legendList.innerHTML = '';
    sortedCommIds.slice(0, 20).forEach(cid => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${commColor[cid] || '#8b8b8b'};"></div><div class="legend-label">${labelsMap[cid] || `Community ${cid}`}</div>`;
      legendList.appendChild(item);
    });

    // One flat grid "panel" per community, panels laid out in a grid of their own —
    // genuinely distinct from graph_3d.html's radial nebula clustering.
    const byComm = {};
    allNodes.forEach(n => { const cid = n.community || 0; (byComm[cid] = byComm[cid] || []).push(n); });
    const commIds = Object.keys(byComm).map(Number).sort((a, b) => byComm[b].length - byComm[a].length);

    const PANEL_COLS = Math.max(1, Math.ceil(Math.sqrt(commIds.length)));
    const PANEL_SPACING = 260;
    const GRID_CELL = 18;

    const nodes = [];
    commIds.forEach((cid, panelIdx) => {
      const members = byComm[cid];
      const panelX = (panelIdx % PANEL_COLS) * PANEL_SPACING;
      const panelY = Math.floor(panelIdx / PANEL_COLS) * PANEL_SPACING;
      const cols = Math.max(1, Math.ceil(Math.sqrt(members.length)));
      members.forEach((n, i) => {
        nodes.push({
          id: n.id, name: n.label, path: n.path, color: n.color,
          fx: panelX + (i % cols) * GRID_CELL,
          fy: panelY + Math.floor(i / cols) * GRID_CELL,
          fz: 0
        });
      });
    });

    document.getElementById('hud').textContent = `🎨 3D Canvas Panels Grid — ${commIds.length} community panels`;

    window.__fpTransparent3D(ForceGraph3D({ rendererConfig: { alpha: true, antialias: true } })(document.getElementById('3d-canvas')))
      .graphData({ nodes, links: [] })
      .nodeLabel('name')
      .nodeColor('color')
      .nodeVal(2)
      .onNodeClick(node => {
        if (window.parent && typeof window.parent.loadFile === 'function') {
          window.parent.loadFile(node.path);
        }
      });
  });
</script>
</body>
</html>
