<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }

  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ececec; font-weight: 500; }
  .legend-count { color: #8b8b8b; font-size: 11px; font-family: monospace; }

  .analytics-btn {

</style>

<body>
<div id="graph"></div>
<div id="minimap-wrap">
  <div id="minimap-header">
    <span>🧭 Radar Topologico</span>
    <span id="minimap-scale">1.0x</span>
  </div>
  <canvas id="minimap" width="160" height="110"></canvas>
</div>
<div id="sidebar">
    <div id="search-wrap">
    <input id="search" type="text" placeholder="🔍 Search nodes..." autocomplete="off" oninput="filterGraphNodes(this.value)">
    <div style="display:flex; gap:6px; margin-top:8px;">
      <button id="btn-toggle-cycles" onclick="toggleCycles()" class="analytics-btn" title="Rileva e illumina dipendenze cicliche">
        <span>🔴</span> Cicli
      </button>
      <button id="btn-toggle-orphans" onclick="toggleOrphans()" class="analytics-btn" title="Isola nodi senza collegamenti (orfani)">
        <span>⚪</span> Orfani
      </button>
      <button id="btn-reset-analytics" onclick="resetAnalyticsView()" class="analytics-btn" title="Ripristina vista standard" style="display:none; max-width:32px;">
        <span>↺</span>
      </button>
    </div>
  </div>
  <div id="info-panel">
    <h3>Node Inspector</h3>
    <div id="info-content"><span style="color:#8b8b8b; font-style:italic;">Click a node to inspect details</span></div>
  </div>
  <div id="legend-wrap">
    <h3>Communities Palette</h3>
    <div id="legend-list">Loading...</div>
  </div>
  <div id="stats">Loading 2D network...</div>
</div>

<script>
  const COMMUNITY_COLORS = [
    "#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F", 
    "#EDC948", "#B07AA1", "#FF9DA7", "#9C755F", "#BAB0AC",
    "#ececec", "#fbbf24", "#f87171", "#ececec", "#a78bfa",
    "#f472b6", "#22d3ee", "#fb923c", "#818cf8", "#4ade80"
  ];

  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [], links: [] };
  }

  let network = null;
  let visNodesDataSet = null;
  let allNodesData = [];

  // ── Graph Analytics Engine (Cicli & Orfani) ──
  let analyticsMode = null; // 'cycles' | 'orphans' | null

  function resetAnalyticsView() {
    analyticsMode = null;
    const btnC = document.getElementById('btn-toggle-cycles');
    const btnO = document.getElementById('btn-toggle-orphans');
    const btnR = document.getElementById('btn-reset-analytics');
    if (btnC) btnC.classList.remove('active-cycle');
    if (btnO) btnO.classList.remove('active-orphan');
    if (btnR) btnR.style.display = 'none';

    egoNodeId = null;
    if (visNodesDataSet && allNodesData.length > 0) {
      visNodesDataSet.update(allNodesData.map(n => ({
        id: n.id,
        color: n.color,
        opacity: 1.0,
        hidden: false,
        font: { color: '#f1f5f9' },
        borderWidth: 1
      })));
    }
    const info = document.getElementById('info-content');
    if (info) info.innerHTML = '<span style="color:#8b8b8b; font-style:italic;">Click a node to inspect details</span>';
  }

  function toggleCycles() {
    if (analyticsMode === 'cycles') {
      resetAnalyticsView();
      return;
    }
    resetAnalyticsView();
    analyticsMode = 'cycles';
    const btnC = document.getElementById('btn-toggle-cycles');
    const btnR = document.getElementById('btn-reset-analytics');
    if (btnC) btnC.classList.add('active-cycle');
    if (btnR) btnR.style.display = 'flex';

    const raw = getVizData();
    const nodes = raw.nodes || [];
    const links = raw.links || [];

    // Costruisci adiacenze dirette
    const adj = new Map();
    nodes.forEach(n => adj.set(n.id, []));
    links.forEach(l => {
      const u = typeof l.source === 'object' ? l.source.id : l.source;
      const v = typeof l.target === 'object' ? l.target.id : l.target;
      if (adj.has(u)) adj.get(u).push(v);
    });

    // DFS per trovare nodi in cicli diretti
    const visited = new Set();
    const recStack = new Set();
    const cycleNodes = new Set();

    function dfs(u, path) {
      visited.add(u);
      recStack.add(u);
      path.push(u);

      const neighbors = adj.get(u) || [];
      for (const v of neighbors) {
        if (!visited.has(v)) {
          dfs(v, path);
        } else if (recStack.has(v)) {
          // Ciclo trovato!
          const cycleStartIdx = path.indexOf(v);
          if (cycleStartIdx !== -1) {
            for (let i = cycleStartIdx; i < path.length; i++) {
              cycleNodes.add(path[i]);
            }
          }
        }
      }
      recStack.delete(u);
      path.pop();
    }

    nodes.forEach(n => {
      if (!visited.has(n.id)) dfs(n.id, []);
    });

    const info = document.getElementById('info-content');
    if (cycleNodes.size === 0) {
      if (info) {
        info.innerHTML = '<div style="color:#ececec; font-weight:700; font-size:13px;">✅ Nessun Ciclo Rilevato</div><div style="font-size:12px; color:#b4b4b4; margin-top:4px;">Il grafo delle dipendenze è un <strong>DAG aciclico perfetto</strong> (zero accoppiamenti circolari).</div>';
      }
    } else {
      if (info) {
        info.innerHTML = `<div style="color:#ef4444; font-weight:700; font-size:13px;">⚠️ ${cycleNodes.size} Nodi in Dipendenze Cicliche</div><div style="font-size:12px; color:#b4b4b4; margin-top:4px;">I nodi ciclici sono evidenziati in <strong>rosso brillante</strong>. Gli altri nodi sono attenuati.</div>`;
      }
      if (visNodesDataSet) {
        const updates = allNodesData.map(n => {
          if (cycleNodes.has(n.id)) {
            return { id: n.id, color: '#ef4444', font: { color: '#fca5a5' }, borderWidth: 3, opacity: 1.0 };
          } else {
            return { id: n.id, color: '#232323', font: { color: '#475569' }, borderWidth: 1, opacity: 0.15 };
          }
        });
        visNodesDataSet.update(updates);
      }
    }
  }

  function toggleOrphans() {
    if (analyticsMode === 'orphans') {
      resetAnalyticsView();
      return;
    }
    resetAnalyticsView();
    analyticsMode = 'orphans';
    const btnO = document.getElementById('btn-toggle-orphans');
    const btnR = document.getElementById('btn-reset-analytics');
    if (btnO) btnO.classList.add('active-orphan');
    if (btnR) btnR.style.display = 'flex';

    const raw = getVizData();
    const nodes = raw.nodes || [];
    const links = raw.links || [];

    const connectedNodes = new Set();
    links.forEach(l => {
      const u = typeof l.source === 'object' ? l.source.id : l.source;
      const v = typeof l.target === 'object' ? l.target.id : l.target;
      connectedNodes.add(u);
      connectedNodes.add(v);
    });

    const orphanNodes = new Set();
    nodes.forEach(n => {
      if (!connectedNodes.has(n.id)) orphanNodes.add(n.id);
    });

    const info = document.getElementById('info-content');
    if (info) {
      info.innerHTML = `<div style="color:#f59e0b; font-weight:700; font-size:13px;">⚪ ${orphanNodes.size} Nodi Orfani / Isolati</div><div style="font-size:12px; color:#b4b4b4; margin-top:4px;">Nodi senza alcuna connessione in entrata o uscita (possibile codice morto o note non referenziate).</div>`;
    }

    if (visNodesDataSet) {
      const updates = allNodesData.map(n => {
        if (orphanNodes.has(n.id)) {
          return { id: n.id, color: '#f59e0b', font: { color: '#fef08a' }, borderWidth: 3, opacity: 1.0 };
        } else {
          return { id: n.id, color: '#232323', font: { color: '#475569' }, borderWidth: 1, opacity: 0.12 };
        }
      });
      visNodesDataSet.update(updates);
    }
  }


  function initGraph() {
    const raw = getVizData();
    const rawNodes = raw.nodes || [];
    const rawLinks = raw.links || [];
    const labelsMap = raw.labels || (window.GRAPH_LABELS) || {};

    if (rawNodes.length === 0) return;

    let maxDeg = 1;
    rawNodes.forEach(n => { if ((n.degree || 1) > maxDeg) maxDeg = n.degree; });

    const commCounts = {};
    rawNodes.forEach(n => {
      const cid = n.community || 0;
      commCounts[cid] = (commCounts[cid] || 0) + 1;
    });

    const legendList = document.getElementById('legend-list');
    legendList.innerHTML = '';
    const sortedCommIds = Object.keys(commCounts).map(Number).sort((a,b) => commCounts[b] - commCounts[a]);

    sortedCommIds.slice(0, 20).forEach(cid => {
      const color = COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
      const name = labelsMap[cid] || `Community ${cid}`;
      const count = commCounts[cid];
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${color};"></div><div class="legend-label">${name}</div><div class="legend-count">${count}</div>`;
      legendList.appendChild(item);
    });

    // Use organic vis.js node formatting. No client-side node cap: server-side
    // build already bounds this (see NODE_CAP in bin/graphify-portal).
    // Compute fast Radial Community Galaxy Layout (prevents vertical grid barcode from static AST coords)
    const _commBuckets = {};
    rawNodes.forEach(n => { const c = n.community || 0; (_commBuckets[c] = _commBuckets[c] || []).push(n); });
    const _commCenter = {};
    const _sortedComms = Object.keys(_commBuckets).map(Number).sort((a, b) => _commBuckets[b].length - _commBuckets[a].length);
    _sortedComms.forEach((c, idx) => {
      const a = idx * 2.3999632;
      const dist = idx === 0 ? 0 : 280 + Math.sqrt(idx) * 290;
      _commCenter[c] = { cx: Math.cos(a) * dist, cy: Math.sin(a) * dist, count: 0, total: _commBuckets[c].length };
    });

    allNodesData = rawNodes.map(n => {
      const cid = n.community || 0;
      const color = n.color || COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
      const deg = n.degree || 1;
      const size = Math.round(8 + 20 * (deg / maxDeg));
      const name = n.label || n.id.split('/').pop();
      const path = n.path || n.id;
      const hasPos = typeof n.x === 'number' && typeof n.y === 'number';

      return {
        id: n.id,
        label: name,
        title: `${name}\nCommunity: ${labelsMap[cid] || cid}`,
        color: { background: color, border: color, highlight: { background: '#ffffff', border: color } },
        size: size,
        font: { color: "#f8fafc", size: deg > maxDeg * 0.1 ? 11 : 0 },
        community: cid,
        path: path,
        deg: deg,
        ...(() => {
          const b = _commCenter[cid] || { cx: 0, cy: 0, count: 0, total: 1 };
          const idxIn = b.count++;
          const radius = 35 + Math.sqrt(idxIn / Math.max(1, b.total)) * Math.min(260, 60 + Math.sqrt(b.total) * 14);
          const theta = idxIn * 2.3999632;
          return { x: Math.round(b.cx + Math.cos(theta) * radius), y: Math.round(b.cy + Math.sin(theta) * radius) };
        })()
      };
    });

    const nodeSet = new Set(allNodesData.map(n => n.id));
    const edgesData = rawLinks.filter(l => nodeSet.has(l.source) && nodeSet.has(l.target)).map((l, idx) => ({
      id: 'e_' + idx,
      from: l.source,
      to: l.target,
      color: { color: 'rgba(51, 65, 85, 0.35)', highlight: '#ececec' },
      width: 1
    }));

    const _seenVisIds = new Set();
    allNodesData = allNodesData.filter(n => { if (_seenVisIds.has(n.id)) return false; _seenVisIds.add(n.id); return true; });
    visNodesDataSet = new vis.DataSet(allNodesData);
    const container = document.getElementById('graph');

    // Layout precalculated server-side (networkx, see bin/graphify-portal): skip
    // in-browser physics entirely when every node already carries x/y. Falls back
    // to the old 120-iteration Barnes-Hut stabilization for older graph_viz.js
    // bundles built before this was wired in.
    const hasPrecomputedLayout = allNodesData.length > 0 && allNodesData.every(n => n.x !== undefined);
    const options = {
      nodes: { shape: 'dot' },
      edges: { smooth: { type: 'continuous' } },
      physics: hasPrecomputedLayout
        ? { enabled: false }
        : {
            enabled: true,
            stabilization: { enabled: true, iterations: 120 },
            barnesHut: { gravitationalConstant: -2500, springLength: 85, springConstant: 0.04 }
          }
    };

    network = new vis.Network(container, { nodes: visNodesDataSet, edges: new vis.DataSet(edgesData) }, options);

    // Freeze physics completely upon stabilization so NO labels or nodes ever move!
    network.once('stabilized', () => {
      network.setOptions({ physics: { enabled: false } });
    });

    document.getElementById('stats').textContent = `${allNodesData.length} organic nodes • ${hasPrecomputedLayout ? 'Radial Community Galaxy' : 'Stabilized static layout'} • 2D Network`;

    network.on('selectNode', p => {
      if (p.nodes.length) {
        const n = allNodesData.find(x => x.id === p.nodes[0]);
        if (n) {
          const isEgoActive = (egoNodeId === n.id);
          document.getElementById('info-content').innerHTML = `
            <strong style="color:#f8fafc; font-size:13px;">${n.label}</strong>
            <div style="font-size:11px; color:#8b8b8b; margin-top:4px; font-family:monospace; word-break:break-all;">${n.path}</div>
            <div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;">
              <button onclick="openNodeInReader('${n.path.replace(/'/g, "\\'")}')" style="flex:1; padding:6px 10px; background:#0284c7; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:11px; font-weight:600;">
                📖 Apri nel Reader
              </button>
              <button onclick="toggleEgoNetwork('${n.id.replace(/'/g, "\\'")}')" style="flex:1; padding:6px 10px; background:${isEgoActive ? '#ef4444' : '#232323'}; color:#fff; border:1px solid ${isEgoActive ? '#ef4444' : 'rgba(255, 255, 255, 0.14)'}; border-radius:6px; cursor:pointer; font-size:11px; font-weight:600;">
                ${isEgoActive ? '↺ Mostra Tutti' : '🎯 Isola Vicini'}
              </button>
            </div>
          `;
        }
      }
    });

    network.on('afterDrawing', () => {
      drawMinimap();
    });

    setupMinimapInteraction();
  }

  // ── Ego-Network Isolation ──
  let egoNodeId = null;

  function toggleEgoNetwork(nodeId) {
    if (!network || !visNodesDataSet) return;

    if (egoNodeId === nodeId) {
      // Restore all
      egoNodeId = null;
      const updates = allNodesData.map(n => ({ id: n.id, hidden: false, opacity: 1.0 }));
      visNodesDataSet.update(updates);
      document.getElementById('btn-reset-analytics').style.display = 'none';
      network.fit({ animation: { duration: 400 } });
      return;
    }

    egoNodeId = nodeId;
    const connected = new Set(network.getConnectedNodes(nodeId));
    connected.add(nodeId);

    const updates = allNodesData.map(n => ({
      id: n.id,
      hidden: !connected.has(n.id)
    }));
    visNodesDataSet.update(updates);
    document.getElementById('btn-reset-analytics').style.display = 'inline-flex';
    network.fit({ nodes: Array.from(connected), animation: { duration: 500 } });

    // Update button text in inspector
    const n = allNodesData.find(x => x.id === nodeId);
    if (n) {
      network.selectNodes([nodeId]);
    }
  }

  function openNodeInReader(path) {
    if (!path) return;
    if (window.parent && typeof window.parent.loadFile === 'function') {
      window.parent.loadFile(path);
    } else {
      window.parent.postMessage({ action: 'openFile', path: path }, '*');
    }
  }

  // ── Radar Minimap Engine ──
  let minimapBounds = null;

  function computeMinimapBounds() {
    if (!allNodesData.length) return { minX: -500, maxX: 500, minY: -500, maxY: 500 };
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    allNodesData.forEach(n => {
      if (typeof n.x === 'number' && typeof n.y === 'number') {
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
      }
    });
    const pad = 80;
    return { minX: minX - pad, maxX: maxX + pad, minY: minY - pad, maxY: maxY + pad };
  }

  function drawMinimap() {
    const canvas = document.getElementById('minimap');
    if (!canvas || !network) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    if (!minimapBounds) {
      minimapBounds = computeMinimapBounds();
    }
    const b = minimapBounds;
    const spanX = (b.maxX - b.minX) || 1;
    const spanY = (b.maxY - b.minY) || 1;

    // Draw all nodes as small dots
    allNodesData.forEach(n => {
      if (typeof n.x === 'number' && typeof n.y === 'number') {
        const mx = ((n.x - b.minX) / spanX) * w;
        const my = ((n.y - b.minY) / spanY) * h;
        ctx.fillStyle = n.color || '#ececec';
        ctx.fillRect(mx, my, 1.8, 1.8);
      }
    });

    // Draw current camera viewport rectangle
    try {
      const scale = network.getScale();
      const pos = network.getViewPosition();
      document.getElementById('minimap-scale').textContent = `${scale.toFixed(1)}x`;

      const viewW = network.canvas.frame.canvas.clientWidth;
      const viewH = network.canvas.frame.canvas.clientHeight;

      const halfWorldW = (viewW / 2) / scale;
      const halfWorldH = (viewH / 2) / scale;

      const camMinX = pos.x - halfWorldW;
      const camMaxX = pos.x + halfWorldW;
      const camMinY = pos.y - halfWorldH;
      const camMaxY = pos.y + halfWorldH;

      const rX = Math.max(0, ((camMinX - b.minX) / spanX) * w);
      const rY = Math.max(0, ((camMinY - b.minY) / spanY) * h);
      const rW = Math.min(w - rX, ((camMaxX - camMinX) / spanX) * w);
      const rH = Math.min(h - rY, ((camMaxY - camMinY) / spanY) * h);

      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 1.5;
      ctx.fillStyle = 'rgba(34, 211, 238, 0.15)';
      ctx.fillRect(rX, rY, rW, rH);
      ctx.strokeRect(rX, rY, rW, rH);
    } catch (e) {}
  }

  function setupMinimapInteraction() {
    const canvas = document.getElementById('minimap');
    if (!canvas) return;

    canvas.addEventListener('click', e => {
      if (!minimapBounds || !network) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const b = minimapBounds;
      const worldX = b.minX + (clickX / canvas.width) * (b.maxX - b.minX);
      const worldY = b.minY + (clickY / canvas.height) * (b.maxY - b.minY);

      network.moveTo({
        position: { x: worldX, y: worldY },
        animation: { duration: 350, easingFunction: 'easeInOutQuad' }
      });
    });
  }

  function filterGraphNodes(q) {
    if (!network || !visNodesDataSet || !q) return;
    const match = allNodesData.find(n => n.label.toLowerCase().includes(q.toLowerCase()));
    if (match) {
      network.selectNodes([match.id]);
      network.focus(match.id, { scale: 1.2, animation: false });
    }
  }

  window.addEventListener('DOMContentLoaded', initGraph);
</script>
</body>
