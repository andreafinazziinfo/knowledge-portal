<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graphify 2D Organic Network</title>
<script src="../assets/vis-network.min.js"></script>
<script>if (typeof vis === "undefined") { document.write('<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"><\/script>'); }</script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070a12; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #graph { flex: 1; height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #070a12 100%); }
  #sidebar { width: 300px; background: #0b101d; border-left: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  #search-wrap { padding: 12px; border-bottom: 1px solid #1e293b; background: #0f172a; }
  #search { width: 100%; background: #020617; border: 1px solid #334155; color: #f8fafc; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #38bdf8; }
  #info-panel { padding: 14px; border-bottom: 1px solid #1e293b; min-height: 130px; background: #090e1a; }
  #info-panel h3 { font-size: 11px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 700; }
  #info-content { font-size: 13px; color: #94a3b8; line-height: 1.5; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 14px; background: #0b101d; }
  #legend-wrap h3 { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 2px; }
  .legend-item:hover { background: #1e293b; }
  .legend-item.dimmed { opacity: 0.25; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; font-weight: 500; }
  .legend-count { color: #64748b; font-size: 11px; font-family: monospace; }
  #stats { padding: 10px 14px; border-top: 1px solid #1e293b; font-size: 11px; color: #64748b; background: #070a12; }
  @media (max-width: 768px) {
    #sidebar { display: none; }
    #graph { width: 100vw !important; }
  }

  .analytics-btn {
    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    color: #cbd5e1;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .analytics-btn:hover {
    border-color: #38bdf8;
    background: #1e293b;
    color: #fff;
  }
  .analytics-btn.active-cycle {
    background: rgba(239, 68, 68, 0.25) !important;
    border-color: #ef4444 !important;
    color: #f87171 !important;
  }
  .analytics-btn.active-orphan {
    background: rgba(245, 158, 11, 0.25) !important;
    border-color: #f59e0b !important;
    color: #fbbf24 !important;
  }

</style>
  <script src="live-reload.js"></script>
</head>
<body>
<div id="graph"></div>
<div id="sidebar">
    <div id="search-wrap">
    <input id="search" type="text" placeholder="🔍 Search nodes..." autocomplete="off" oninput="filterGraphNodes(this.value)">
    <div style="display:flex; gap:6px; margin-top:8px;">
      <button id="btn-toggle-cycles" onclick="toggleCycles()" class="analytics-btn" title="Rileva e illumina dipendenze cicliche">
        <span>🔴</span> Cicli
      </button>
      <button id="btn-toggle-orphans" onclick="toggleOrphans()" class="analytics-btn" title="Isola nodi senza collegamenti (orfani)">
        <span>⚪</span> Orfani
      </button>
      <button id="btn-reset-analytics" onclick="resetAnalyticsView()" class="analytics-btn" title="Ripristina vista standard" style="display:none; max-width:32px;">
        <span>↺</span>
      </button>
    </div>
  </div>
  <div id="info-panel">
    <h3>Node Inspector</h3>
    <div id="info-content"><span style="color:#64748b; font-style:italic;">Click a node to inspect details</span></div>
  </div>
  <div id="legend-wrap">
    <h3>Communities Palette</h3>
    <div id="legend-list">Loading...</div>
  </div>
  <div id="stats">Loading 2D network...</div>
</div>

<script>
  const COMMUNITY_COLORS = [
    "#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F", 
    "#EDC948", "#B07AA1", "#FF9DA7", "#9C755F", "#BAB0AC",
    "#38bdf8", "#fbbf24", "#f87171", "#34d399", "#a78bfa",
    "#f472b6", "#22d3ee", "#fb923c", "#818cf8", "#4ade80"
  ];

  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [], links: [] };
  }

  let network = null;
  let visNodesDataSet = null;
  let allNodesData = [];

  // ── Graph Analytics Engine (Cicli & Orfani) ──
  let analyticsMode = null; // 'cycles' | 'orphans' | null

  function resetAnalyticsView() {
    analyticsMode = null;
    const btnC = document.getElementById('btn-toggle-cycles');
    const btnO = document.getElementById('btn-toggle-orphans');
    const btnR = document.getElementById('btn-reset-analytics');
    if (btnC) btnC.classList.remove('active-cycle');
    if (btnO) btnO.classList.remove('active-orphan');
    if (btnR) btnR.style.display = 'none';

    if (visNodesDataSet && allNodesData.length > 0) {
      visNodesDataSet.update(allNodesData.map(n => ({
        id: n.id,
        color: n.color,
        opacity: 1.0,
        font: { color: '#f1f5f9' },
        borderWidth: 1
      })));
    }
    const info = document.getElementById('info-content');
    if (info) info.innerHTML = '<span style="color:#64748b; font-style:italic;">Click a node to inspect details</span>';
  }

  function toggleCycles() {
    if (analyticsMode === 'cycles') {
      resetAnalyticsView();
      return;
    }
    resetAnalyticsView();
    analyticsMode = 'cycles';
    const btnC = document.getElementById('btn-toggle-cycles');
    const btnR = document.getElementById('btn-reset-analytics');
    if (btnC) btnC.classList.add('active-cycle');
    if (btnR) btnR.style.display = 'flex';

    const raw = getVizData();
    const nodes = raw.nodes || [];
    const links = raw.links || [];

    // Costruisci adiacenze dirette
    const adj = new Map();
    nodes.forEach(n => adj.set(n.id, []));
    links.forEach(l => {
      const u = typeof l.source === 'object' ? l.source.id : l.source;
      const v = typeof l.target === 'object' ? l.target.id : l.target;
      if (adj.has(u)) adj.get(u).push(v);
    });

    // DFS per trovare nodi in cicli diretti
    const visited = new Set();
    const recStack = new Set();
    const cycleNodes = new Set();

    function dfs(u, path) {
      visited.add(u);
      recStack.add(u);
      path.push(u);

      const neighbors = adj.get(u) || [];
      for (const v of neighbors) {
        if (!visited.has(v)) {
          dfs(v, path);
        } else if (recStack.has(v)) {
          // Ciclo trovato!
          const cycleStartIdx = path.indexOf(v);
          if (cycleStartIdx !== -1) {
            for (let i = cycleStartIdx; i < path.length; i++) {
              cycleNodes.add(path[i]);
            }
          }
        }
      }
      recStack.delete(u);
      path.pop();
    }

    nodes.forEach(n => {
      if (!visited.has(n.id)) dfs(n.id, []);
    });

    const info = document.getElementById('info-content');
    if (cycleNodes.size === 0) {
      if (info) {
        info.innerHTML = '<div style="color:#10b981; font-weight:700; font-size:13px;">✅ Nessun Ciclo Rilevato</div><div style="font-size:12px; color:#94a3b8; margin-top:4px;">Il grafo delle dipendenze è un <strong>DAG aciclico perfetto</strong> (zero accoppiamenti circolari).</div>';
      }
    } else {
      if (info) {
        info.innerHTML = `<div style="color:#ef4444; font-weight:700; font-size:13px;">⚠️ ${cycleNodes.size} Nodi in Dipendenze Cicliche</div><div style="font-size:12px; color:#94a3b8; margin-top:4px;">I nodi ciclici sono evidenziati in <strong>rosso brillante</strong>. Gli altri nodi sono attenuati.</div>`;
      }
      if (visNodesDataSet) {
        const updates = allNodesData.map(n => {
          if (cycleNodes.has(n.id)) {
            return { id: n.id, color: '#ef4444', font: { color: '#fca5a5' }, borderWidth: 3, opacity: 1.0 };
          } else {
            return { id: n.id, color: '#1e293b', font: { color: '#475569' }, borderWidth: 1, opacity: 0.15 };
          }
        });
        visNodesDataSet.update(updates);
      }
    }
  }

  function toggleOrphans() {
    if (analyticsMode === 'orphans') {
      resetAnalyticsView();
      return;
    }
    resetAnalyticsView();
    analyticsMode = 'orphans';
    const btnO = document.getElementById('btn-toggle-orphans');
    const btnR = document.getElementById('btn-reset-analytics');
    if (btnO) btnO.classList.add('active-orphan');
    if (btnR) btnR.style.display = 'flex';

    const raw = getVizData();
    const nodes = raw.nodes || [];
    const links = raw.links || [];

    const connectedNodes = new Set();
    links.forEach(l => {
      const u = typeof l.source === 'object' ? l.source.id : l.source;
      const v = typeof l.target === 'object' ? l.target.id : l.target;
      connectedNodes.add(u);
      connectedNodes.add(v);
    });

    const orphanNodes = new Set();
    nodes.forEach(n => {
      if (!connectedNodes.has(n.id)) orphanNodes.add(n.id);
    });

    const info = document.getElementById('info-content');
    if (info) {
      info.innerHTML = `<div style="color:#f59e0b; font-weight:700; font-size:13px;">⚪ ${orphanNodes.size} Nodi Orfani / Isolati</div><div style="font-size:12px; color:#94a3b8; margin-top:4px;">Nodi senza alcuna connessione in entrata o uscita (possibile codice morto o note non referenziate).</div>`;
    }

    if (visNodesDataSet) {
      const updates = allNodesData.map(n => {
        if (orphanNodes.has(n.id)) {
          return { id: n.id, color: '#f59e0b', font: { color: '#fef08a' }, borderWidth: 3, opacity: 1.0 };
        } else {
          return { id: n.id, color: '#1e293b', font: { color: '#475569' }, borderWidth: 1, opacity: 0.12 };
        }
      });
      visNodesDataSet.update(updates);
    }
  }


  function initGraph() {
    const raw = getVizData();
    const rawNodes = raw.nodes || [];
    const rawLinks = raw.links || [];
    const labelsMap = raw.labels || (window.GRAPH_LABELS) || {};

    if (rawNodes.length === 0) return;

    let maxDeg = 1;
    rawNodes.forEach(n => { if ((n.degree || 1) > maxDeg) maxDeg = n.degree; });

    const commCounts = {};
    rawNodes.forEach(n => {
      const cid = n.community || 0;
      commCounts[cid] = (commCounts[cid] || 0) + 1;
    });

    const legendList = document.getElementById('legend-list');
    legendList.innerHTML = '';
    const sortedCommIds = Object.keys(commCounts).map(Number).sort((a,b) => commCounts[b] - commCounts[a]);

    sortedCommIds.slice(0, 20).forEach(cid => {
      const color = COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
      const name = labelsMap[cid] || `Community ${cid}`;
      const count = commCounts[cid];
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${color};"></div><div class="legend-label">${name}</div><div class="legend-count">${count}</div>`;
      legendList.appendChild(item);
    });

    // Use organic vis.js node formatting. No client-side node cap: server-side
    // build already bounds this (see NODE_CAP in bin/graphify-portal).
    allNodesData = rawNodes.map(n => {
      const cid = n.community || 0;
      const color = n.color || COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
      const deg = n.degree || 1;
      const size = Math.round(8 + 20 * (deg / maxDeg));
      const name = n.label || n.id.split('/').pop();
      const path = n.path || n.id;
      const hasPos = typeof n.x === 'number' && typeof n.y === 'number';

      return {
        id: n.id,
        label: name,
        title: `${name}\nCommunity: ${labelsMap[cid] || cid}`,
        color: { background: color, border: color, highlight: { background: '#ffffff', border: color } },
        size: size,
        font: { color: "#f8fafc", size: deg > maxDeg * 0.1 ? 11 : 0 },
        community: cid,
        path: path,
        deg: deg,
        ...(hasPos ? { x: n.x, y: n.y, fixed: { x: true, y: true } } : {})
      };
    });

    const nodeSet = new Set(allNodesData.map(n => n.id));
    const edgesData = rawLinks.filter(l => nodeSet.has(l.source) && nodeSet.has(l.target)).map((l, idx) => ({
      id: 'e_' + idx,
      from: l.source,
      to: l.target,
      color: { color: 'rgba(51, 65, 85, 0.35)', highlight: '#38bdf8' },
      width: 1
    }));

    visNodesDataSet = new vis.DataSet(allNodesData);
    const container = document.getElementById('graph');

    // Layout precalculated server-side (networkx, see bin/graphify-portal): skip
    // in-browser physics entirely when every node already carries x/y. Falls back
    // to the old 120-iteration Barnes-Hut stabilization for older graph_viz.js
    // bundles built before this was wired in.
    const hasPrecomputedLayout = allNodesData.length > 0 && allNodesData.every(n => n.x !== undefined);
    const options = {
      nodes: { shape: 'dot' },
      edges: { smooth: { type: 'continuous' } },
      physics: hasPrecomputedLayout
        ? { enabled: false }
        : {
            enabled: true,
            stabilization: { enabled: true, iterations: 120 },
            barnesHut: { gravitationalConstant: -2500, springLength: 85, springConstant: 0.04 }
          }
    };

    network = new vis.Network(container, { nodes: visNodesDataSet, edges: new vis.DataSet(edgesData) }, options);

    // Freeze physics completely upon stabilization so NO labels or nodes ever move!
    network.once('stabilized', () => {
      network.setOptions({ physics: { enabled: false } });
    });

    document.getElementById('stats').textContent = `${allNodesData.length} organic nodes • ${hasPrecomputedLayout ? 'Precalculated layout (networkx)' : 'Stabilized static layout'} • 2D Network`;

    network.on('selectNode', p => {
      if (p.nodes.length) {
        const n = allNodesData.find(x => x.id === p.nodes[0]);
        if (n) {
          document.getElementById('info-content').innerHTML = `
            <strong style="color:#f8fafc;">${n.label}</strong>
            <div style="font-size:11px; color:#64748b; margin-top:4px;">${n.path}</div>
            <button onclick="window.parent.loadFile('${n.path.replace(/'/g, "\\'")}')" style="margin-top:8px; padding:5px 10px; background:#0284c7; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px;">📖 Open Note</button>
          `;
        }
      }
    });
  }

  function filterGraphNodes(q) {
    if (!network || !visNodesDataSet || !q) return;
    const match = allNodesData.find(n => n.label.toLowerCase().includes(q.toLowerCase()));
    if (match) {
      network.selectNodes([match.id]);
      network.focus(match.id, { scale: 1.2, animation: false });
    }
  }

  window.addEventListener('DOMContentLoaded', initGraph);
</script>
</body>
</html>
