<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCity 3D — Software Architecture Metropolis</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <script src="../data/graph_labels.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #cc-hud {
      position: absolute; top: 14px; left: 14px; z-index: 20;
      background: rgba(20, 20, 20, 0.92); border: 1px solid #2b2b2b; border-radius: 10px;
      padding: 10px 14px; font-size: 12px; color: #d4d4d8; max-width: 340px;
    }
    #cc-hud strong { color: #ffffff; }
    #cc-tip {
      position: fixed; pointer-events: none; z-index: 40; display: none;
      background: #171717; border: 1px solid #404040; border-radius: 6px;
      padding: 7px 11px; font-size: 11px; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.65);
    }
  </style>
</head>
<body>
  <div id="cc-hud">
    <strong>CodeCity 3D (Isometric 60 FPS)</strong><br>
    <span style="font-size:11px; color:#9ca3af;">Districts = folders · Footprint = symbols · Height = coupling degree · Drag to pan · Scroll to zoom</span>
  </div>
  <canvas id="cc-canvas"></canvas>
  <div id="cc-tip"></div>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const PALETTE = ['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#22d3ee','#f472b6','#a3e635','#fb923c','#818cf8','#2dd4bf','#facc15','#fb7185','#c084fc','#60a5fa'];
    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [] };
    const fileMap = new Map();
    for (const n of (raw.nodes || [])) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      const key = p.includes('/') || p.includes('.') ? p : String(n.id);
      if (!fileMap.has(key)) {
        const parts = p.split('/').filter(Boolean);
        const district = parts.length >= 2 ? parts.slice(0, 2).join('/') : (parts[0] || 'root');
        fileMap.set(key, { path: p, name: parts[parts.length - 1] || key, district, symbols: 1, degree: n.degree || 1, comm: n.community || 0 });
      } else {
        const f = fileMap.get(key);
        f.symbols += 1;
        f.degree = Math.max(f.degree, n.degree || 1);
      }
    }

    const byDist = new Map();
    for (const f of fileMap.values()) {
      if (!byDist.has(f.district)) byDist.set(f.district, []);
      byDist.get(f.district).push(f);
    }
    const hier = {
      name: 'city',
      children: Array.from(byDist.entries()).map(([d, arr]) => ({
        name: d,
        children: arr.sort((a, b) => b.symbols - a.symbols).slice(0, 120).map(f => ({
          name: f.name, path: f.path, district: d, value: Math.max(1, f.symbols), degree: f.degree,
          color: PALETTE[Math.abs(f.comm) % PALETTE.length]
        }))
      }))
    };

    const CITY = 760;
    const root = d3.hierarchy(hier).sum(d => d.value || 1).sort((a, b) => b.value - a.value);
    d3.treemap().size([CITY, CITY]).paddingOuter(10).paddingInner(4)(root);

    const buildings = root.leaves().map(d => ({
      x0: d.x0 - CITY / 2, y0: d.y0 - CITY / 2,
      w: Math.max(4, d.x1 - d.x0), l: Math.max(4, d.y1 - d.y0),
      h: Math.min(180, 10 + Math.sqrt(d.data.degree || 1) * 18 + Math.log1p(d.data.value) * 8),
      color: d.data.color || '#38bdf8',
      path: d.data.path, district: d.data.district, symbols: d.data.value, degree: d.data.degree
    }));
    // Painter's algorithm sort (back to front)
    buildings.sort((a, b) => (a.x0 + a.y0) - (b.x0 + b.y0));

    const canvas = document.getElementById('cc-canvas');
    const ctx = canvas.getContext('2d');
    const tip = document.getElementById('cc-tip');
    let W = window.innerWidth, H = window.innerHeight;
    let panX = 0, panY = 80, zoom = 0.95, dragging = false, lx = 0, ly = 0;

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      draw();
    }

    function iso(x, y, z) {
      return {
        sx: W / 2 + panX + (x - y) * 0.72 * zoom,
        sy: H / 2 + panY + (x + y) * 0.38 * zoom - z * zoom
      };
    }

    function shade(hex, f) {
      const c = d3.color(hex);
      if (!c) return hex;
      c.r = Math.min(255, Math.max(0, Math.round(c.r * f)));
      c.g = Math.min(255, Math.max(0, Math.round(c.g * f)));
      c.b = Math.min(255, Math.max(0, Math.round(c.b * f)));
      return c.formatHex();
    }

    let screenRects = [];
    function draw() {
      ctx.clearRect(0, 0, W, H);
      screenRects = [];
      for (const b of buildings) {
        const p00 = iso(b.x0, b.y0, 0);
        const p10 = iso(b.x0 + b.w, b.y0, 0);
        const p11 = iso(b.x0 + b.w, b.y0 + b.l, 0);
        const p01 = iso(b.x0, b.y0 + b.l, 0);
        const t00 = iso(b.x0, b.y0, b.h);
        const t10 = iso(b.x0 + b.w, b.y0, b.h);
        const t11 = iso(b.x0 + b.w, b.y0 + b.l, b.h);
        const t01 = iso(b.x0, b.y0 + b.l, b.h);

        // Left face
        ctx.beginPath();
        ctx.moveTo(p01.sx, p01.sy); ctx.lineTo(p11.sx, p11.sy); ctx.lineTo(t11.sx, t11.sy); ctx.lineTo(t01.sx, t01.sy); ctx.closePath();
        ctx.fillStyle = shade(b.color, 0.55); ctx.fill();
        // Right face
        ctx.beginPath();
        ctx.moveTo(p10.sx, p10.sy); ctx.lineTo(p11.sx, p11.sy); ctx.lineTo(t11.sx, t11.sy); ctx.lineTo(t10.sx, t10.sy); ctx.closePath();
        ctx.fillStyle = shade(b.color, 0.72); ctx.fill();
        // Top roof
        ctx.beginPath();
        ctx.moveTo(t00.sx, t00.sy); ctx.lineTo(t10.sx, t10.sy); ctx.lineTo(t11.sx, t11.sy); ctx.lineTo(t01.sx, t01.sy); ctx.closePath();
        ctx.fillStyle = shade(b.color, 1.05); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.6; ctx.stroke();

        screenRects.push({ b, cx: (t00.sx + t11.sx) / 2, cy: (t00.sy + p11.sy) / 2, r: Math.max(6, (b.w + b.l) * 0.3 * zoom) });
      }
    }

    canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('mouseup', () => { dragging = false; });
    window.addEventListener('mousemove', e => {
      if (dragging) {
        panX += e.clientX - lx; panY += e.clientY - ly; lx = e.clientX; ly = e.clientY;
        draw();
        return;
      }
      let hit = null;
      for (let i = screenRects.length - 1; i >= 0; i--) {
        const sr = screenRects[i];
        if (Math.hypot(e.clientX - sr.cx, e.clientY - sr.cy) <= sr.r) { hit = sr.b; break; }
      }
      if (hit) {
        tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 10) + 'px';
        tip.innerHTML = `<strong>${hit.path}</strong><br>District: ${hit.district} · Symbols: ${hit.symbols} · Degree: ${hit.degree}`;
      } else {
        tip.style.display = 'none';
      }
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      zoom = Math.max(0.3, Math.min(4.0, zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
      draw();
    }, { passive: false });

    window.addEventListener('resize', resize);
    resize();
  })();
  </script>
</body>
</html>
