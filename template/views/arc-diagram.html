<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Diagram — Directional & Cycle Inspector</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
    #ad-hud { position: absolute; top: 14px; left: 14px; z-index: 20; background: rgba(20,20,20,0.92); border: 1px solid #2b2b2b; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #d4d4d8; max-width: 440px; }
    #ad-hud strong { color: #fff; }
    #ad-stage { width: 100vw; height: 100vh; }
    #ad-tip { position: fixed; pointer-events: none; z-index: 40; display: none; background: #171717; border: 1px solid #404040; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #fff; }
  </style>
</head>
<body>
  <div id="ad-hud">
    <strong>Linear Layer Arc Diagram</strong><br>
    <span style="font-size:11px; color:#9ca3af;">Ordered Presentation → API → Domain → Workers → Data · <span style="color:#ffffff;">Top arcs = forward</span> · <span style="color:#ef4444;">Bottom red arcs = backward / cycles</span></span>
  </div>
  <div id="ad-stage"></div>
  <div id="ad-tip"></div>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const LAYERS = [
      { id: 0, name: 'UI', color: '#38bdf8', match: /frontend|vue|\.tsx?$|\.jsx?$|store|component|view|ui|dashboard/i },
      { id: 1, name: 'API', color: '#a855f7', match: /api|router|route|ws|websocket|endpoint|gateway|server/i },
      { id: 2, name: 'Domain', color: '#34d399', match: /service|quant|engine|core|domain|logic|scanner|generator/i },
      { id: 3, name: 'Workers', color: '#fbbf24', match: /task|worker|celery|cli|script|watcher|job|beat/i },
      { id: 4, name: 'Data', color: '#f87171', match: /sql|db|alembic|model|schema|redis|docker|infra|config|yaml/i },
    ];
    function layerOf(p) { for (const l of LAYERS) if (l.match.test(p)) return l; return LAYERS[2]; }

    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [], edges: [] };
    const fMap = new Map(), id2f = new Map(), p2f = new Map(), s2f = new Map();
    for (const n of (raw.nodes || [])) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      const key = p.includes('/') || p.includes('.') ? p : String(n.id);
      if (!fMap.has(key)) {
        const l = layerOf(p);
        fMap.set(key, { id: key, name: p.split('/').pop() || key, layer: l.id, color: l.color, deg: 0 });
      }
      id2f.set(String(n.id), key);
      const low = p.toLowerCase();
      p2f.set(low, key); s2f.set(low.replace(/\.[^/.]+$/, ''), key);
    }
    function res(r) {
      const s = String(r || '');
      if (fMap.has(s)) return s;
      if (id2f.has(s)) return id2f.get(s);
      const low = s.replace(/\\/g, '/').toLowerCase();
      return p2f.get(low) || s2f.get(low.replace(/\.[^/.]+$/, '')) || null;
    }
    const edges = [];
    for (const e of (raw.edges || raw.links || [])) {
      const s = res(typeof e.source === 'object' ? e.source.id : e.source);
      const t = res(typeof e.target === 'object' ? e.target.id : e.target);
      if (s && t && s !== t) { edges.push([s, t]); fMap.get(s).deg++; fMap.get(t).deg++; }
    }

    const top = Array.from(fMap.values()).filter(f => f.deg > 0).sort((a, b) => b.deg - a.deg).slice(0, 90);
    top.sort((a, b) => (a.layer - b.layer) || (b.deg - a.deg));
    const idxMap = new Map(top.map((n, i) => [n.id, i]));
    const visEdges = edges.filter(([s, t]) => idxMap.has(s) && idxMap.has(t)).map(([s, t]) => ({ s: idxMap.get(s), t: idxMap.get(t), sn: s, tn: t }));

    const W = window.innerWidth, H = window.innerHeight, midY = H * 0.52, pad = 44;
    const x = d3.scalePoint().domain(d3.range(top.length)).range([pad, W - pad]);
    const tip = document.getElementById('ad-tip');
    const svg = d3.select('#ad-stage').append('svg').attr('width', W).attr('height', H);

    const arcSel = svg.append('g').selectAll('path').data(visEdges).join('path')
      .attr('fill', 'none')
      .attr('d', d => {
        const x1 = x(d.s), x2 = x(d.t), dist = Math.abs(x2 - x1);
        const h = Math.min(H * 0.4, dist * 0.42);
        const dir = d.s < d.t ? -1 : 1; // top = forward, bottom = backward!
        return `M${x1},${midY} Q${(x1 + x2) / 2},${midY + dir * h} ${x2},${midY}`;
      })
      .attr('stroke', d => d.s < d.t ? 'rgba(255,255,255,0.22)' : 'rgba(239,68,68,0.45)')
      .attr('stroke-width', d => d.s < d.t ? 1 : 1.3);

    svg.append('g').selectAll('circle').data(top).join('circle')
      .attr('cx', (_, i) => x(i)).attr('cy', midY).attr('r', d => Math.min(8, Math.max(3.5, Math.sqrt(d.deg))))
      .attr('fill', d => d.color).attr('stroke', '#0f0f0f').style('cursor', 'pointer')
      .on('mouseenter', (ev, d) => {
        const idx = idxMap.get(d.id);
        arcSel.attr('stroke-opacity', l => (l.s === idx || l.t === idx) ? 1 : 0.04)
          .attr('stroke-width', l => (l.s === idx || l.t === idx) ? 2.2 : 0.8);
        tip.style.display = 'block'; tip.style.left = (ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY - 10) + 'px';
        tip.innerHTML = `<strong>${d.id}</strong><br>Layer: ${LAYERS[d.layer].name} · Degree: ${d.deg}`;
      })
      .on('mouseleave', () => {
        arcSel.attr('stroke-opacity', 1).attr('stroke-width', d => d.s < d.t ? 1 : 1.3);
        tip.style.display = 'none';
      })
      .on('click', (_, d) => { try { window.parent.postMessage({ action: 'openFile', path: d.id }, '*'); } catch (_) {} });
  })();
  </script>
</body>
</html>
