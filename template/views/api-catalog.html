<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Portal — Live API &amp; Endpoint Explorer</title>
  <script src="live-reload.js"></script>
  <script src="../data/api_catalog.js" onerror="void(0)"></script>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script defer src="portal-ui.js?v=fp4"></script>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #141414;
      --card: #191919;
      --border: #262626;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { font-size: 20px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
    .brand-title { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { background: #1e293b; border: 1px solid #334155; color: #38bdf8; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; font-family: ui-monospace, monospace; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-box { background: #0f0f0f; border: 1px solid var(--border); color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 12px; width: 260px; outline: none; }
    .search-box:focus { border-color: #38bdf8; }
    .view-toggle { display: flex; background: #0f0f0f; border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 4px; }
    .view-btn { background: transparent; border: none; color: var(--text-muted); padding: 5px 11px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .view-btn.active { background: #262626; color: #fff; }
    .method-bar { display: flex; gap: 6px; padding: 8px 24px; background: #121212; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
    .m-chip { background: #191919; border: 1px solid #2b2b2b; color: #a3a3a3; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: ui-monospace, monospace; }
    .m-chip.active { background: #fff; color: #0f0f0f; border-color: #fff; }
    .main-wrap { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 230px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px; flex-shrink: 0; }
    .tag-item { padding: 7px 12px; border-radius: 6px; font-size: 12px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: space-between; margin-bottom: 2px; }
    .tag-item:hover, .tag-item.active { background: rgba(255,255,255,0.06); color: #fff; }
    .tag-item.active { border-left: 2px solid var(--accent); color: var(--accent); font-weight: 600; }
    .content-area { flex: 1; overflow-y: auto; padding: 18px 24px; }
    .ep-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; margin-bottom: 10px; }
    .ep-card:hover { border-color: #404040; }
    .ep-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .ep-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .method-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .m-GET { background: rgba(52,211,153,0.16); color: #34d399; border: 1px solid rgba(52,211,153,0.35); }
    .m-POST { background: rgba(59,130,246,0.18); color: #60a5fa; border: 1px solid rgba(59,130,246,0.35); }
    .m-PUT, .m-PATCH { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .m-DELETE { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
    .m-WS { background: rgba(168,85,247,0.18); color: #c084fc; border: 1px solid rgba(168,85,247,0.35); }
    .ep-path { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; color: #fff; }
    .auth-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; font-family: ui-monospace, monospace; }
    .auth-Protected { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .auth-Public { background: rgba(148,163,184,0.14); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.3); }
    .ep-summary { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .ep-details { margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #a3a3a3; }
    .ep-link { color: #38bdf8; cursor: pointer; font-family: ui-monospace, monospace; text-decoration: underline; }
    .empty { color: #737373; font-size: 13px; padding: 24px 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🔌</div>
      <div>
        <div class="brand-title">Live API &amp; Endpoint Explorer <span class="badge" id="ep-stats-badge">Loading...</span></div>
        <div style="font-size:12px;color:var(--text-muted);" id="ep-sub">Auto-discovered HTTP &amp; WebSocket routes from codebase AST &amp; OpenAPI specs</div>
      </div>
    </div>
    <div class="controls">
      <div class="view-toggle">
        <button id="view-native-btn" class="view-btn active" onclick="switchApiView('native')">📑 Routes &amp; Auth</button>
        <button id="view-scalar-btn" class="view-btn" onclick="switchApiView('scalar')">⚡ OpenAPI JSON</button>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="Filter path, tag, handler, file..." oninput="renderList()">
    </div>
  </header>

  <div class="method-bar" id="methodBar">
    <button class="m-chip active" onclick="selectMethod('ALL', this)">ALL</button>
    <button class="m-chip" onclick="selectMethod('GET', this)">GET</button>
    <button class="m-chip" onclick="selectMethod('POST', this)">POST</button>
    <button class="m-chip" onclick="selectMethod('PUT', this)">PUT</button>
    <button class="m-chip" onclick="selectMethod('PATCH', this)">PATCH</button>
    <button class="m-chip" onclick="selectMethod('DELETE', this)">DELETE</button>
    <button class="m-chip" onclick="selectMethod('WS', this)">WS</button>
  </div>

  <div class="main-wrap" id="nativeWrap">
    <div class="sidebar" id="tagSidebar"></div>
    <div class="content-area" id="endpointsList"></div>
  </div>
  <div id="scalar-container" style="display:none;flex:1;overflow:auto;padding:20px 24px;background:#0f0f0f;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <strong>Generated OpenAPI 3.1 Specification</strong>
      <button class="m-chip active" onclick="downloadOpenApi()">⬇ Download openapi.json</button>
    </div>
    <pre id="openapiPre" style="background:#141414;border:1px solid #262626;border-radius:8px;padding:16px;font-size:12px;color:#d4d4d8;overflow:auto;max-height:76vh;"></pre>
  </div>

  <script>
    let CATALOG = { summary: { total_endpoints: 0, total_tags: 0 }, tags: [], endpoints: [], openapi: {} };
    let activeTag = 'ALL';
    let activeMethod = 'ALL';

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function openInReader(filePath) {
      if (!filePath) return;
      try { window.parent.postMessage({ action: 'openFile', path: filePath }, '*'); } catch (_) {}
    }
    function selectTag(t) { activeTag = t; renderSidebar(); renderList(); }
    function selectMethod(m, btn) {
      activeMethod = m;
      document.querySelectorAll('#methodBar .m-chip').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderList();
    }
    function switchApiView(mode) {
      document.getElementById('view-native-btn').classList.toggle('active', mode === 'native');
      document.getElementById('view-scalar-btn').classList.toggle('active', mode === 'scalar');
      document.getElementById('nativeWrap').style.display = mode === 'native' ? 'flex' : 'none';
      document.getElementById('methodBar').style.display = mode === 'native' ? 'flex' : 'none';
      document.getElementById('scalar-container').style.display = mode === 'scalar' ? 'block' : 'none';
    }
    function downloadOpenApi() {
      const blob = new Blob([JSON.stringify(CATALOG.openapi || {}, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'openapi.json';
      a.click();
    }

    function renderSidebar() {
      const eps = CATALOG.endpoints || [];
      const counts = {};
      eps.forEach(e => { counts[e.tag || 'General'] = (counts[e.tag || 'General'] || 0) + 1; });
      const sb = document.getElementById('tagSidebar');
      let html = `<div class="tag-item ${activeTag === 'ALL' ? 'active' : ''}" onclick="selectTag('ALL')"><span>All Tags</span><span>${eps.length}</span></div>`;
      Object.keys(counts).sort().forEach(t => {
        html += `<div class="tag-item ${activeTag === t ? 'active' : ''}" onclick="selectTag('${esc(t)}')"><span>${esc(t)}</span><span style="opacity:0.65;">${counts[t]}</span></div>`;
      });
      sb.innerHTML = html;
    }

    function renderList() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const eps = (CATALOG.endpoints || []).filter(e => {
        if (activeTag !== 'ALL' && (e.tag || 'General') !== activeTag) return false;
        if (activeMethod !== 'ALL' && e.method !== activeMethod) return false;
        if (!q) return true;
        return `${e.method} ${e.path} ${e.tag} ${e.summary} ${e.handler} ${e.file}`.toLowerCase().includes(q);
      });
      const el = document.getElementById('endpointsList');
      if (!eps.length) {
        el.innerHTML = '<div class="empty">No matching endpoints discovered.</div>';
        return;
      }
      el.innerHTML = eps.map(e => `
        <div class="ep-card">
          <div class="ep-top">
            <div class="ep-left">
              <span class="method-badge m-${esc(e.method)}">${esc(e.method)}</span>
              <span class="ep-path">${esc(e.path)}</span>
              <span class="badge">${esc(e.tag || 'General')}</span>
            </div>
            <span class="auth-badge auth-${esc(e.auth || 'Public')}">${esc(e.auth || 'Public')}</span>
          </div>
          <div class="ep-summary">${esc(e.summary || '')}</div>
          <div class="ep-details">
            <span>Handler: <code>${esc(e.handler || '-')}</code></span>
            <span>File: <span class="ep-link" onclick="openInReader('${esc(e.file)}')">${esc(e.file)}:${e.line || 1}</span></span>
            ${e.response_model ? `<span>Response: <code>${esc(e.response_model)}</code></span>` : ''}
            <span>Stack: ${esc(e.framework || 'HTTP')}</span>
          </div>
        </div>
      `).join('');
    }

    async function init() {
      let loaded = window.API_CATALOG || null;
      if (!loaded) {
        for (const url of ['/api/endpoints', '../data/api-catalog.json', 'data/api-catalog.json']) {
          try {
            const res = await fetch(url);
            if (res.ok) { const j = await res.json(); if (j && Array.isArray(j.endpoints)) { loaded = j; break; } }
          } catch (_) {}
        }
      }
      if (loaded) CATALOG = loaded;
      const s = CATALOG.summary || {};
      document.getElementById('ep-stats-badge').textContent = `${s.total_endpoints ?? (CATALOG.endpoints || []).length} ENDPOINTS · ${s.total_tags ?? (CATALOG.tags || []).length} TAGS`;
      document.getElementById('openapiPre').textContent = JSON.stringify(CATALOG.openapi || {}, null, 2);
      renderSidebar();
      renderList();
    }
    init();
  </script>
</body>
</html>
