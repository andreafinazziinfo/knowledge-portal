<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radial Tidy Tree — 360° Directory Hierarchy</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
    #rt-hud { position: absolute; top: 14px; left: 14px; z-index: 20; background: rgba(20,20,20,0.92); border: 1px solid #2b2b2b; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #d4d4d8; }
    #rt-hud strong { color: #fff; }
    #rt-svg { width: 100vw; height: 100vh; display: block; cursor: grab; }
    #rt-svg:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="rt-hud">
    <strong>360° Radial Tidy Tree</strong><br>
    <span style="font-size:11px; color:#9ca3af;">Scroll to zoom (up to 15x) · Drag to pan · Click any file leaf to open in Reader</span>
  </div>
  <svg id="rt-svg"><g id="rt-g"></g></svg>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const PALETTE = ['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#22d3ee','#f472b6','#a3e635','#fb923c','#818cf8','#2dd4bf','#facc15','#fb7185','#c084fc','#60a5fa'];
    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [] };
    const rootObj = { name: 'Codebase', children: [] };
    const fmap = new Map([['', rootObj]]);
    const seen = new Set();

    for (const n of (raw.nodes || [])) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      if (seen.has(p)) continue;
      seen.add(p);
      const parts = p.split('/').filter(Boolean);
      const col = n.color || PALETTE[Math.abs(n.community || 0) % PALETTE.length];
      let cur = '', parent = rootObj;
      for (let i = 0; i < parts.length; i++) {
        const seg = parts[i];
        const next = cur ? cur + '/' + seg : seg;
        if (i === parts.length - 1) {
          parent.children.push({ name: seg, path: p, color: col });
        } else {
          if (!fmap.has(next)) {
            const f = { name: seg, children: [], color: col };
            fmap.set(next, f);
            parent.children.push(f);
          }
          parent = fmap.get(next);
        }
        cur = next;
      }
    }

    const W = window.innerWidth, H = window.innerHeight;
    const radius = Math.min(W, H) * 0.42;
    const root = d3.hierarchy(rootObj).sort((a, b) => d3.ascending(a.data.name, b.data.name));
    d3.tree().size([2 * Math.PI, radius]).separation((a, b) => (a.parent === b.parent ? 1 : 2) / Math.max(1, a.depth))(root);

    const svg = d3.select('#rt-svg');
    const g = d3.select('#rt-g');
    const zoom = d3.zoom().scaleExtent([0.2, 15]).on('zoom', ev => g.attr('transform', ev.transform));
    svg.call(zoom).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(0.95));

    g.append('g').attr('fill', 'none').selectAll('path').data(root.links()).join('path')
      .attr('stroke', d => d.target.data.color || '#38bdf8')
      .attr('stroke-opacity', 0.35).attr('stroke-width', 1)
      .attr('d', d3.linkRadial().angle(d => d.x).radius(d => d.y));

    const nd = g.append('g').selectAll('g').data(root.descendants()).join('g')
      .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
      .style('cursor', 'pointer')
      .on('click', (_, d) => { if (d.data.path) { try { window.parent.postMessage({ action: 'openFile', path: d.data.path }, '*'); } catch (_) {} } });

    nd.append('circle').attr('r', d => d.children ? 3.2 : 2.2).attr('fill', d => d.data.color || '#ffffff');
    nd.append('text')
      .attr('dy', '0.31em').attr('x', d => d.x < Math.PI === !d.children ? 5 : -5)
      .attr('text-anchor', d => d.x < Math.PI === !d.children ? 'start' : 'end')
      .attr('transform', d => d.x >= Math.PI ? 'rotate(180)' : null)
      .attr('fill', d => d.children ? '#ffffff' : (d.data.color || '#d4d4d8'))
      .attr('font-size', d => d.depth <= 2 ? '9px' : '6.5px')
      .text(d => d.data.name.length > 18 ? d.data.name.slice(0, 17) + '…' : d.data.name);
  })();
  </script>
</body>
</html>
