<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph Studio — Unified Codebase Explorer</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f0f;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .gs-shell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    .gs-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(15, 15, 15, 0.96);
      border-bottom: 1px solid #262626;
      z-index: 30;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .gs-toolbar::-webkit-scrollbar { display: none; }
    .gs-brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      padding-right: 10px;
      border-right: 1px solid #2a2a2a;
    }
    .gs-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      background: #171717;
      border: 1px solid #262626;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .gs-group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #737373;
      padding: 0 6px;
      user-select: none;
    }
    .gs-btn {
      background: transparent;
      color: #a3a3a3;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .gs-btn:hover {
      color: #ffffff;
      border-color: #404040;
      background: #222222;
    }
    .gs-btn.active {
      color: #0f0f0f;
      background: #ffffff;
      border-color: #ffffff;
      font-weight: 600;
    }
    .gs-stage {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      background: #0f0f0f;
    }
    #gs-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0f0f0f;
    }
  </style>
</head>
<body>
  <div class="gs-shell">
    <div class="gs-toolbar" role="toolbar" aria-label="Graph Studio Mode Selector">
      <div class="gs-brand">Graph Studio</div>

      <div class="gs-group">
        <span class="gs-group-label">Network</span>
        <button class="gs-btn" data-mode="graph">2D Graph</button>
        <button class="gs-btn" data-mode="graph_3d">3D Sphere</button>
        <button class="gs-btn" data-mode="particle-flow">Particle Flow</button>
        <button class="gs-btn" data-mode="chord">Chord Matrix</button>
        <button class="gs-btn" data-mode="edge-bundling">Edge Bundling</button>
        <button class="gs-btn" data-mode="arc-diagram">Arc Diagram</button>
        <button class="gs-btn" data-mode="hive-plot">Hive Plot</button>
      </div>

      <div class="gs-group">
        <span class="gs-group-label">Arch</span>
        <button class="gs-btn" data-mode="canvas">2D Canvas</button>
        <button class="gs-btn" data-mode="canvas_3d">3D Z-Planes</button>
        <button class="gs-btn" data-mode="codecity">CodeCity 3D</button>
        <button class="gs-btn" data-mode="sankey">Sankey Flow</button>
      </div>

      <div class="gs-group">
        <span class="gs-group-label">Hierarchy</span>
        <button class="gs-btn" data-mode="tree">Tree</button>
        <button class="gs-btn" data-mode="treemap">Treemap</button>
        <button class="gs-btn" data-mode="sunburst">Sunburst</button>
        <button class="gs-btn" data-mode="circle-pack">Circle Pack</button>
        <button class="gs-btn" data-mode="icicle">Icicle</button>
        <button class="gs-btn" data-mode="tree_3d">3D Tree</button>
      </div>

      <div class="gs-group">
        <span class="gs-group-label">Audit</span>
        <button class="gs-btn" data-mode="arch-health">Arch Health</button>
      </div>
    </div>

    <div class="gs-stage">
      <iframe id="gs-frame" title="Graph Studio Active View"></iframe>
    </div>
  </div>

  <script src="portal-ui.js?v=fp3"></script>
  <script>
  (function () {
    const MODES = {
      'graph':         { file: 'graph.html',      sub: null },
      'graph_3d':      { file: 'graph_3d.html',   sub: null },
      'particle-flow': { file: 'graph_full.html', sub: 'flow',     fn: 'setMode' },
      'chord':         { file: 'graph_full.html',    sub: 'chord',    fn: 'setMode' },
      'edge-bundling': { file: 'edge-bundling.html', sub: null },
      'arc-diagram':   { file: 'arc-diagram.html',   sub: null },
      'hive-plot':     { file: 'hive-plot.html',     sub: null },
      'canvas':        { file: 'canvas.html',        sub: null },
      'canvas_3d':     { file: 'canvas_3d.html',     sub: null },
      'codecity':      { file: 'codecity.html',      sub: null },
      'sankey':        { file: 'sankey-flow.html',   sub: null },
      'tree':          { file: 'GRAPH_TREE.html',    sub: 'tree',     fn: 'setTreeMode' },
      'treemap':       { file: 'GRAPH_TREE.html',    sub: 'treemap',  fn: 'setTreeMode' },
      'sunburst':      { file: 'GRAPH_TREE.html',    sub: 'sunburst', fn: 'setTreeMode' },
      'circle-pack':   { file: 'circle-pack.html',   sub: null },
      'icicle':        { file: 'icicle.html',        sub: null },
      'tree_3d':       { file: 'tree_3d.html',    sub: null },
      'arch-health':   { file: 'arch-health.html', sub: null }
    };

    const ALIASES = {
      '2d-galaxy': 'graph',
      '3d-sphere': 'graph_3d',
      '2d-board': 'canvas',
      '3d-zplanes': 'canvas_3d',
      '3d-tree': 'tree_3d',
      'graph_full': 'particle-flow'
    };

    const frame = document.getElementById('gs-frame');
    let currentFile = null;
    let currentMode = null;

    function resolveMode(m) {
      const key = ALIASES[m] || m;
      return MODES[key] ? key : 'graph';
    }

    function activateMode(rawMode) {
      const mode = resolveMode(rawMode);
      const spec = MODES[mode];
      currentMode = mode;

      document.querySelectorAll('.gs-btn[data-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      try {
        const p = new URLSearchParams(window.location.search);
        p.set('mode', mode);
        history.replaceState(null, '', '?' + p.toString());
      } catch (_) {}

      // Instant in-place sub-mode switch if the same host page is already loaded
      if (currentFile === spec.file && spec.fn && frame.contentWindow && typeof frame.contentWindow[spec.fn] === 'function') {
        try {
          frame.contentWindow[spec.fn](spec.sub);
          return;
        } catch (_) {}
      }

      currentFile = spec.file;
      const targetUrl = spec.sub ? `${spec.file}?mode=${encodeURIComponent(spec.sub)}&embed=1` : spec.file;
      frame.src = targetUrl;
    }

    window.setStudioMode = activateMode;

    document.querySelectorAll('.gs-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => activateMode(btn.dataset.mode));
    });

    const initial = new URLSearchParams(window.location.search).get('mode') || 'graph';
    activateMode(initial);
  })();
  </script>
</body>
</html>
