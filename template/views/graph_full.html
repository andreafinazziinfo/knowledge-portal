<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Portal — 2D Particle Flow &amp; Community Chord</title>
<script src="../assets/force-graph.min.js"></script>
<script src="../assets/d3.v7.min.js"></script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #ececec; font-family: "Inter", ui-sans-serif, system-ui, sans-serif; overflow: hidden; display: flex; height: 100vh; }
  #stage-wrap { flex: 1; position: relative; height: 100vh; overflow: hidden; }
  #graph, #chord-wrap { position: absolute; inset: 0; width: 100%; height: 100%; }
  #chord-wrap { display: none; align-items: center; justify-content: center; }
  #chord-wrap svg { max-width: 92%; max-height: 92%; }
  #hud {
    position: absolute; top: 14px; left: 14px; z-index: 12;
    background: rgba(26, 26, 26, 0.88); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
    padding: 12px 14px; font-size: 12px; color: #b4b4b4;
    display: flex; flex-direction: column; gap: 8px;
  }
  #hud strong { color: #ececec; font-size: 13px; font-weight: 600; }
  .hud-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #sidebar {
    width: 260px; background: rgba(26, 26, 26, 0.88); backdrop-filter: blur(16px);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; flex-direction: column; z-index: 10; overflow-y: auto;
    padding: 50px 14px 14px 14px; flex-shrink: 0;
  }
  #sidebar h3 { font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 2px; transition: background 0.15s; }
  .legend-item:hover { background: #232323; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ececec; }
  .legend-count { font-family: "JetBrains Mono", monospace; font-size: 11px; color: #8b8b8b; }
  #chord-tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 20;
    background: rgba(26, 26, 26, 0.94); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px; padding: 6px 10px; font-size: 11.5px; color: #ececec;
  }
</style>
<script src="live-reload.js"></script>
<link rel="stylesheet" href="portal-theme.css?v=fp3">
<script defer src="portal-ui.js?v=fp3"></script>
</head>
<body>
<div id="stage-wrap">
  <div id="hud">
    <strong id="hud-title">2D Animated Particle Flow</strong>
    <div id="hud-stats">Loading network...</div>
    <div class="hud-row">
      <button class="btn active" id="btn-flow" onclick="setMode('flow')">Particle Flow</button>
      <button class="btn" id="btn-chord" onclick="setMode('chord')">Chord Matrix</button>
      <button class="btn" id="btn-fit" onclick="fitView()">Fit</button>
    </div>
  </div>
  <div id="graph"></div>
  <div id="chord-wrap"><svg id="chord-svg"></svg></div>
  <div id="chord-tooltip"></div>
</div>
<div id="sidebar">
  <h3>Communities</h3>
  <div id="legend-list"></div>
</div>

<script>
  const COMMUNITY_COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1','#14b8a6','#eab308','#f43f5e','#8b5cf6','#22d3ee'];
  let fgInstance = null;
  let currentMode = 'flow';
  let rawNodes = [], rawLinks = [], commIds = [], labelsMap = {}, commCounts = {};

  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [], edges: [], links: [] };
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-flow').classList.toggle('active', mode === 'flow');
    document.getElementById('btn-chord').classList.toggle('active', mode === 'chord');
    document.getElementById('graph').style.display = mode === 'flow' ? 'block' : 'none';
    document.getElementById('chord-wrap').style.display = mode === 'chord' ? 'flex' : 'none';
    document.getElementById('btn-fit').style.display = mode === 'flow' ? 'inline-flex' : 'none';
    document.getElementById('hud-title').textContent = mode === 'flow' ? '2D Animated Particle Flow' : 'Community Coupling Chord Matrix';
    if (mode === 'chord') renderChord();
  }

  function fitView() {
    if (fgInstance) fgInstance.zoomToFit(450, 40);
  }

  function renderFlow() {
    const el = document.getElementById('graph');
    if (typeof ForceGraph === 'undefined') {
      el.innerHTML = '<div style="padding:80px 24px;color:#8b8b8b;">force-graph.min.js unavailable</div>';
      return;
    }
    const maxLinks = 4000;
    const linksSubset = rawLinks.slice(0, maxLinks);
    fgInstance = ForceGraph()(el)
      .backgroundColor('rgba(0,0,0,0)')
      .graphData({ nodes: rawNodes, links: linksSubset })
      .nodeLabel(n => `${n.name} (Community ${n.community})`)
      .nodeColor(n => n.color)
      .nodeVal(n => Math.min(8, Math.max(1.5, Math.sqrt(n.degree || 1))))
      .linkColor(() => 'rgba(255, 255, 255, 0.14)')
      .linkDirectionalParticles(1)
      .linkDirectionalParticleSpeed(0.004)
      .linkDirectionalParticleWidth(1.6)
      .linkDirectionalParticleColor(() => '#ececec')
      .cooldownTicks(80)
      .onEngineStop(() => fgInstance.zoomToFit(400, 40));
  }

  function renderChord() {
    const svg = d3.select('#chord-svg');
    svg.selectAll('*').remove();
    const wrap = document.getElementById('chord-wrap');
    const size = Math.min(wrap.clientWidth || 720, wrap.clientHeight || 720, 740);
    const outerRadius = size * 0.42;
    const innerRadius = outerRadius - 22;
    svg.attr('width', size).attr('height', size).attr('viewBox', `${-size / 2} ${-size / 2} ${size} ${size}`);

    const n = Math.max(1, commIds.length);
    const idxMap = new Map(commIds.map((c, i) => [c, i]));
    const nodeComm = new Map(rawNodes.map(nd => [nd.id, nd.community]));
    const matrix = Array.from({ length: n }, () => Array(n).fill(0));

    rawLinks.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      const ci = idxMap.get(nodeComm.get(s));
      const cj = idxMap.get(nodeComm.get(t));
      if (ci !== undefined && cj !== undefined) {
        matrix[ci][cj] += 1;
        if (ci !== cj) matrix[cj][ci] += 1;
      }
    });

    // Ensure non-zero diagonal when graph has no cross-edges
    commIds.forEach((cid, i) => {
      if (matrix[i].reduce((a, b) => a + b, 0) === 0) matrix[i][i] = Math.max(1, commCounts[cid] || 1);
    });

    const chord = d3.chord().padAngle(0.04).sortSubgroups(d3.descending)(matrix);
    const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
    const ribbon = d3.ribbon().radius(innerRadius - 2);
    const tip = document.getElementById('chord-tooltip');

    const g = svg.append('g');
    const group = g.append('g').selectAll('g').data(chord.groups).join('g');

    group.append('path')
      .attr('fill', d => COMMUNITY_COLORS[commIds[d.index] % COMMUNITY_COLORS.length])
      .attr('stroke', 'rgba(255,255,255,0.18)')
      .attr('d', arc)
      .on('mousemove', (ev, d) => {
        const cid = commIds[d.index];
        tip.style.display = 'block';
        tip.style.left = (ev.offsetX + 14) + 'px';
        tip.style.top = (ev.offsetY + 14) + 'px';
        tip.textContent = `${labelsMap[cid] || 'Community ' + cid} — ${d.value} links (${commCounts[cid] || 0} nodes)`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; });

    group.append('text')
      .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
      .attr('dy', '0.35em')
      .attr('transform', d => `rotate(${(d.angle * 180 / Math.PI - 90)}) translate(${outerRadius + 10})${d.angle > Math.PI ? ' rotate(180)' : ''}`)
      .attr('text-anchor', d => d.angle > Math.PI ? 'end' : null)
      .attr('fill', '#b4b4b4')
      .attr('font-size', '11px')
      .text(d => {
        const cid = commIds[d.index];
        const lbl = labelsMap[cid] || `C${cid}`;
        return lbl.length > 16 ? lbl.slice(0, 15) + '…' : lbl;
      });

    g.append('g')
      .attr('fill-opacity', 0.45)
      .selectAll('path')
      .data(chord)
      .join('path')
      .attr('d', ribbon)
      .attr('fill', d => COMMUNITY_COLORS[commIds[d.source.index] % COMMUNITY_COLORS.length])
      .attr('stroke', 'rgba(255,255,255,0.08)')
      .on('mousemove', (ev, d) => {
        const a = labelsMap[commIds[d.source.index]] || `C${commIds[d.source.index]}`;
        const b = labelsMap[commIds[d.target.index]] || `C${commIds[d.target.index]}`;
        tip.style.display = 'block';
        tip.style.left = (ev.offsetX + 14) + 'px';
        tip.style.top = (ev.offsetY + 14) + 'px';
        tip.textContent = `${a} ↔ ${b}: ${d.source.value} couplings`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const raw = getVizData();
    labelsMap = raw.labels || window.GRAPH_LABELS || {};
    const nodesIn = raw.nodes || [];
    const linksIn = raw.links || raw.edges || [];

    commCounts = {};
    rawNodes = nodesIn.map(n => {
      const cid = n.community || 0;
      commCounts[cid] = (commCounts[cid] || 0) + 1;
      return {
        id: n.id,
        name: n.label || n.name || n.id,
        community: cid,
        degree: n.degree || 1,
        color: n.color || COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length],
      };
    });
    const validIds = new Set(rawNodes.map(n => n.id));
    rawLinks = linksIn
      .map(l => ({ source: typeof l.source === 'object' ? l.source.id : l.source, target: typeof l.target === 'object' ? l.target.id : l.target }))
      .filter(l => validIds.has(l.source) && validIds.has(l.target));

    commIds = Object.keys(commCounts).map(Number).sort((a, b) => (commCounts[b] - commCounts[a]));
    document.getElementById('hud-stats').textContent = `${rawNodes.length.toLocaleString()} nodes • ${rawLinks.length.toLocaleString()} edges • ${commIds.length} communities`;

    const leg = document.getElementById('legend-list');
    commIds.forEach(cid => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length]}"></div><div class="legend-label">${labelsMap[cid] || 'Community ' + cid}</div><div class="legend-count">${commCounts[cid]}</div>`;
      item.onclick = () => {
        if (currentMode === 'flow' && fgInstance) {
          const match = rawNodes.find(n => n.community === cid);
          if (match && typeof match.x === 'number') fgInstance.centerAt(match.x, match.y, 600);
        }
      };
      leg.appendChild(item);
    });

    renderFlow();
  });

  (function() {
    const _qs = new URLSearchParams(window.location.search);
    if (_qs.get('embed') === '1') { const bf = document.getElementById('btn-flow'); const bc = document.getElementById('btn-chord'); if (bf) bf.style.display='none'; if (bc) bc.style.display='none'; }
    const m = _qs.get('mode');
    if (m === 'chord' && typeof setMode === 'function') setTimeout(() => setMode('chord'), 80);
  })();
</script>
</body>
</html>
