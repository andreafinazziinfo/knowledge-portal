<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Portal — Particle Flow & Chord Matrix</title>
<script src="../assets/force-graph.min.js"></script>
<script src="../assets/d3.v7.min.js"></script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #ececec; font-family: 'Inter', system-ui, sans-serif; display: flex; }
  #stage { flex: 1; position: relative; min-width: 0; height: 100%; overflow: hidden; }
  #graph, #chord-wrap { position: absolute; inset: 0; width: 100%; height: 100%; }
  #chord-wrap { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #chord-wrap svg { max-width: 94%; max-height: 86%; overflow: visible; }
  #chord-guide {
    margin-top: 8px;
    font-size: 11px;
    color: #9ca3af;
    background: rgba(25, 25, 25, 0.9);
    border: 1px solid #2b2b2b;
    padding: 5px 12px;
    border-radius: 999px;
  }
  #hud {
    position: absolute; top: 14px; left: 14px; z-index: 20;
    background: rgba(25, 25, 25, 0.92); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
    backdrop-filter: blur(8px); max-width: 360px;
  }
  .hud-title { font-size: 13px; font-weight: 600; color: #ffffff; }
  .hud-sub { font-size: 11px; color: #9ca3af; }
  .hud-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: #141414; color: #b4b4b4; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer;
  }
  .btn:hover { color: #fff; border-color: rgba(255,255,255,0.45); }
  .btn.active { background: #ffffff; color: #0f0f0f; border-color: #ffffff; font-weight: 600; }
  #sidebar {
    width: 260px; flex-shrink: 0; background: #141414; border-left: 1px solid rgba(255,255,255,0.08);
    padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }
  #sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b8b8b; margin-bottom: 4px; }
  .legend-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    background: #191919; border: 1px solid rgba(255,255,255,0.06); cursor: pointer; font-size: 11px;
  }
  .legend-item:hover, .legend-item.active { border-color: rgba(255,255,255,0.45); background: #222222; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e5e7eb; }
  .legend-count { color: #8b8b8b; font-size: 10px; }
  #chord-tooltip {
    position: absolute; pointer-events: none; z-index: 30; display: none;
    background: #191919; border: 1px solid rgba(255,255,255,0.28); border-radius: 6px;
    padding: 7px 11px; font-size: 11px; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  @media (max-width: 900px) { #sidebar { display: none; } }
</style>
<script src="live-reload.js"></script>
<link rel="stylesheet" href="portal-theme.css?v=fp3">
<script defer src="portal-ui.js?v=fp3"></script>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div class="hud-title" id="hud-title">2D Animated Particle Flow</div>
    <div class="hud-sub" id="hud-stats">Loading graph...</div>
    <div class="hud-row">
      <button class="btn active" id="btn-flow" onclick="setMode('flow')">Particle Flow</button>
      <button class="btn" id="btn-chord" onclick="setMode('chord')">Chord Matrix</button>
      <button class="btn active" id="btn-connected" onclick="toggleConnectedOnly()">Connected Backbone</button>
      <button class="btn" id="btn-fit" onclick="fitView()">Fit</button>
    </div>
  </div>
  <div id="graph"></div>
  <div id="chord-wrap">
    <svg id="chord-svg"></svg>
    <div id="chord-guide">Hover an arc or ribbon to inspect cross-module dependencies · Click an arc to lock highlight</div>
  </div>
  <div id="chord-tooltip"></div>
</div>
<div id="sidebar">
  <h3>Communities</h3>
  <div id="legend-list"></div>
</div>

<script>
  const COMMUNITY_COLORS = ['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#22d3ee','#f472b6','#a3e635','#fb923c','#818cf8','#2dd4bf','#facc15','#fb7185','#c084fc','#60a5fa'];
  let fgInstance = null;
  let currentMode = 'flow';
  let connectedOnly = true;
  let lockedChordIdx = null;
  let rawNodes = [], rawLinks = [], commIds = [], labelsMap = {}, commCounts = {};

  function getVizData() {
    return window.GRAPH_VIZ || window.GRAPH_DATA || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [], edges: [], links: [] };
  }

  function deriveCommunityLabels(nodes) {
    const folderFreq = {};
    for (const n of nodes) {
      const cid = n.community;
      const p = String(n.path || '').replace(/\\/g, '/').replace(/^\/+/, '');
      if (!p) continue;
      const parts = p.split('/').filter(Boolean);
      const bucket = parts.length >= 2 ? `${parts[0]}/${parts[1]}` : (parts[0] || '');
      if (!bucket) continue;
      if (!folderFreq[cid]) folderFreq[cid] = {};
      folderFreq[cid][bucket] = (folderFreq[cid][bucket] || 0) + 1;
    }
    const derived = {};
    for (const cid of Object.keys(folderFreq)) {
      const top = Object.entries(folderFreq[cid]).sort((a, b) => b[1] - a[1])[0];
      if (top) derived[cid] = `C${cid} · ${top[0]}`;
    }
    return derived;
  }

  function setMode(mode) {
    currentMode = mode;
    const bf = document.getElementById('btn-flow');
    const bc = document.getElementById('btn-chord');
    if (bf) bf.classList.toggle('active', mode === 'flow');
    if (bc) bc.classList.toggle('active', mode === 'chord');
    document.getElementById('graph').style.display = mode === 'flow' ? 'block' : 'none';
    document.getElementById('chord-wrap').style.display = mode === 'chord' ? 'flex' : 'none';
    document.getElementById('btn-fit').style.display = mode === 'flow' ? 'inline-flex' : 'none';
    document.getElementById('btn-connected').style.display = mode === 'flow' ? 'inline-flex' : 'none';
    document.getElementById('hud-title').textContent = mode === 'flow' ? '2D Animated Particle Flow' : 'Community Coupling Chord Matrix';
    if (mode === 'chord') {
      renderChord();
    } else if (!fgInstance) {
      renderFlow();
    }
  }

  function toggleConnectedOnly() {
    connectedOnly = !connectedOnly;
    const btn = document.getElementById('btn-connected');
    btn.classList.toggle('active', connectedOnly);
    btn.textContent = connectedOnly ? 'Connected Backbone' : 'All Nodes';
    renderFlow();
  }

  function fitView() {
    if (fgInstance) fgInstance.zoomToFit(450, 50);
  }

  function renderFlow() {
    const el = document.getElementById('graph');
    if (typeof ForceGraph === 'undefined') {
      el.innerHTML = '<div style="padding:80px 24px;color:#8b8b8b;">force-graph.min.js unavailable</div>';
      return;
    }
    if (fgInstance && typeof fgInstance._destructor === 'function') {
      try { fgInstance._destructor(); } catch (_) {}
      fgInstance = null;
    }
    el.innerHTML = '';

    const linksSubset = rawLinks.slice(0, connectedOnly ? 420 : 2500).map(l => ({
      source: typeof l.source === 'object' ? l.source.id : l.source,
      target: typeof l.target === 'object' ? l.target.id : l.target,
      type: l.type || 'link',
    }));

    let displayNodes = rawNodes;
    if (connectedOnly && linksSubset.length > 0) {
      const activeIds = new Set();
      for (const l of linksSubset) { activeIds.add(l.source); activeIds.add(l.target); }
      displayNodes = rawNodes.filter(n => activeIds.has(n.id));
    }

    document.getElementById('hud-stats').textContent =
      `${displayNodes.length.toLocaleString()} / ${rawNodes.length.toLocaleString()} modules • ${linksSubset.length.toLocaleString()} / ${rawLinks.length.toLocaleString()} edges • ${commIds.length} domains`;

    fgInstance = ForceGraph()(el)
      .backgroundColor('rgba(0,0,0,0)')
      .graphData({ nodes: displayNodes.map(n => ({ ...n })), links: linksSubset })
      .nodeLabel(n => `${n.name}\n${n.path || ''}\n${labelsMap[n.community] || ('Community ' + n.community)}`)
      .nodeColor(n => n.color)
      .nodeVal(n => Math.min(10, Math.max(2.5, Math.sqrt((n.degree || 1) * 2))))
      .linkColor(() => 'rgba(255, 255, 255, 0.22)')
      .linkWidth(1.1)
      .linkDirectionalParticles(1)
      .linkDirectionalParticleSpeed(0.009)
      .linkDirectionalParticleWidth(2.2)
      .linkDirectionalParticleColor(() => '#ffffff')
      .d3VelocityDecay(0.35)
      .cooldownTicks(80)
      .onEngineStop(() => { if (fgInstance) fgInstance.zoomToFit(450, 50); });

    document.addEventListener('visibilitychange', () => {
      if (!fgInstance) return;
      if (document.hidden && typeof fgInstance.pauseAnimation === 'function') fgInstance.pauseAnimation();
      else if (!document.hidden && typeof fgInstance.resumeAnimation === 'function') fgInstance.resumeAnimation();
    });

    setTimeout(() => { if (fgInstance) fgInstance.zoomToFit(500, 50); }, 700);
  }

  function renderChord() {
    const svg = d3.select('#chord-svg');
    svg.selectAll('*').remove();
    const wrap = document.getElementById('chord-wrap');
    const size = Math.min((wrap.clientWidth || 720) - 40, (wrap.clientHeight || 720) - 70, 700);
    const outerRadius = size * 0.36;
    const innerRadius = outerRadius - 20;
    svg.attr('width', size).attr('height', size).attr('viewBox', `${-size / 2} ${-size / 2} ${size} ${size}`);

    const n = Math.max(1, commIds.length);
    const idxMap = new Map(commIds.map((c, i) => [c, i]));
    const nodeComm = new Map(rawNodes.map(nd => [nd.id, nd.community]));
    const matrix = Array.from({ length: n }, () => Array(n).fill(0));
    let crossEdges = 0;

    rawLinks.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      const ci = idxMap.get(nodeComm.get(s));
      const cj = idxMap.get(nodeComm.get(t));
      if (ci !== undefined && cj !== undefined) {
        matrix[ci][cj] += 1;
        if (ci !== cj) {
          matrix[cj][ci] += 1;
          crossEdges++;
        }
      }
    });

    commIds.forEach((cid, i) => {
      if (matrix[i].reduce((a, b) => a + b, 0) === 0) matrix[i][i] = 1;
    });

    const chord = d3.chord().padAngle(0.05).sortSubgroups(d3.descending)(matrix);
    const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
    const ribbon = d3.ribbon().radius(innerRadius - 3);
    const tip = document.getElementById('chord-tooltip');
    const guide = document.getElementById('chord-guide');
    guide.textContent = crossEdges > 0
      ? `${crossEdges} cross-community couplings detected · Hover any arc/ribbon to isolate · Click arc to lock`
      : `Showing module cluster sizes · Hover any arc to inspect`;

    const g = svg.append('g');
    const ribbonsSel = g.append('g')
      .selectAll('path')
      .data(chord)
      .join('path')
      .attr('d', ribbon)
      .attr('fill', d => COMMUNITY_COLORS[commIds[d.source.index] % COMMUNITY_COLORS.length])
      .attr('fill-opacity', d => d.source.index === d.target.index ? 0.25 : 0.65)
      .attr('stroke', 'rgba(255,255,255,0.12)')
      .style('cursor', 'pointer');

    function applyHighlight(focusIdx) {
      ribbonsSel.transition().duration(140).attr('fill-opacity', d => {
        if (focusIdx === null) return d.source.index === d.target.index ? 0.25 : 0.65;
        return (d.source.index === focusIdx || d.target.index === focusIdx) ? 0.88 : 0.05;
      });
    }

    ribbonsSel
      .on('mousemove', (ev, d) => {
        const a = labelsMap[commIds[d.source.index]] || `C${commIds[d.source.index]}`;
        const b = labelsMap[commIds[d.target.index]] || `C${commIds[d.target.index]}`;
        tip.style.display = 'block';
        tip.style.left = (ev.clientX + 14) + 'px';
        tip.style.top = (ev.clientY - 12) + 'px';
        tip.textContent = d.source.index === d.target.index
          ? `${a} (internal links: ${d.source.value})`
          : `${a} ↔ ${b}: ${d.source.value} cross-module imports`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; });

    const group = g.append('g').selectAll('g').data(chord.groups).join('g');

    group.append('path')
      .attr('fill', d => COMMUNITY_COLORS[commIds[d.index] % COMMUNITY_COLORS.length])
      .attr('stroke', 'rgba(255,255,255,0.22)')
      .attr('d', arc)
      .style('cursor', 'pointer')
      .on('mouseenter', (_, d) => { if (lockedChordIdx === null) applyHighlight(d.index); })
      .on('mousemove', (ev, d) => {
        const cid = commIds[d.index];
        tip.style.display = 'block';
        tip.style.left = (ev.clientX + 14) + 'px';
        tip.style.top = (ev.clientY - 12) + 'px';
        tip.textContent = `${labelsMap[cid] || 'Community ' + cid} — ${d.value} links (${commCounts[cid] || 0} symbols)`;
      })
      .on('mouseleave', () => {
        tip.style.display = 'none';
        if (lockedChordIdx === null) applyHighlight(null);
      })
      .on('click', (_, d) => {
        lockedChordIdx = lockedChordIdx === d.index ? null : d.index;
        applyHighlight(lockedChordIdx);
      });

    group.append('text')
      .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
      .attr('dy', '0.35em')
      .attr('transform', d => `rotate(${(d.angle * 180 / Math.PI - 90)}) translate(${outerRadius + 10})${d.angle > Math.PI ? ' rotate(180)' : ''}`)
      .attr('text-anchor', d => d.angle > Math.PI ? 'end' : null)
      .attr('fill', '#d4d4d8')
      .attr('font-size', '11px')
      .attr('font-weight', '500')
      .text(d => {
        const cid = commIds[d.index];
        const lbl = labelsMap[cid] || `C${cid}`;
        return lbl.length > 22 ? lbl.slice(0, 21) + '…' : lbl;
      });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const raw = getVizData();
    const nodesIn = raw.nodes || [];
    const linksIn = raw.links || raw.edges || [];

    // Collapse symbols to file-level modules so Particle Flow & Chord show 1,400 clean modules (93% connected) instead of 23k floating symbol dots
    commCounts = {};
    const fileMap = new Map();
    const idToFile = new Map();
    const pathToId = new Map();
    const stemToId = new Map();
    const labelToId = new Map();

    for (const n of nodesIn) {
      const cid = Number.isFinite(Number(n.community)) ? Number(n.community) : 0;
      const rawPath = String(n.path || n.label || n.id).replace(/\\/g, '/');
      const key = (rawPath.includes('/') || rawPath.includes('.')) ? rawPath : String(n.id);
      if (!fileMap.has(key)) {
        commCounts[cid] = (commCounts[cid] || 0) + 1;
        fileMap.set(key, {
          id: key,
          name: rawPath.split('/').pop() || n.label || key,
          path: rawPath,
          community: cid,
          degree: n.degree || 1,
          color: n.color || COMMUNITY_COLORS[Math.abs(cid) % COMMUNITY_COLORS.length],
        });
      }
      idToFile.set(String(n.id), key);
      const p = rawPath.toLowerCase();
      if (!pathToId.has(p)) pathToId.set(p, key);
      const noExt = p.replace(/\.[^/.]+$/, '');
      if (!stemToId.has(noExt)) stemToId.set(noExt, key);
      const lbl = String(n.label || n.name || '').toLowerCase().replace(/\(\)$/, '');
      if (lbl && !labelToId.has(lbl)) labelToId.set(lbl, key);
    }
    rawNodes = Array.from(fileMap.values());

    const derived = deriveCommunityLabels(rawNodes);
    labelsMap = { ...derived, ...(raw.labels || {}), ...(window.GRAPH_LABELS || {}) };

    function resolveRef(ref) {
      const s = String(ref || '');
      if (fileMap.has(s)) return s;
      if (idToFile.has(s)) return idToFile.get(s);
      const norm = s.replace(/\\/g, '/').toLowerCase();
      if (pathToId.has(norm)) return pathToId.get(norm);
      const noExt = norm.replace(/\.[^/.]+$/, '');
      if (stemToId.has(noExt)) return stemToId.get(noExt);
      return labelToId.get(norm) || null;
    }

    const seenPairs = new Set();
    rawLinks = [];
    for (const l of linksIn) {
      const sRaw = typeof (l.source ?? l.from) === 'object' ? (l.source ?? l.from).id : (l.source ?? l.from);
      const tRaw = typeof (l.target ?? l.to) === 'object' ? (l.target ?? l.to).id : (l.target ?? l.to);
      const s = resolveRef(sRaw);
      const t = resolveRef(tRaw);
      if (!s || !t || s === t) continue;
      const pk = s + '->' + t;
      if (seenPairs.has(pk)) continue;
      seenPairs.add(pk);
      rawLinks.push({ source: s, target: t, type: l.type || 'link' });
    }

    commIds = Object.keys(commCounts).map(Number).sort((a, b) => (commCounts[b] - commCounts[a]));

    const leg = document.getElementById('legend-list');
    commIds.forEach(cid => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${COMMUNITY_COLORS[Math.abs(cid) % COMMUNITY_COLORS.length]}"></div><div class="legend-label" title="${labelsMap[cid] || 'Community ' + cid}">${labelsMap[cid] || 'Community ' + cid}</div><div class="legend-count">${commCounts[cid]}</div>`;
      item.onclick = () => {
        if (currentMode === 'flow' && fgInstance) {
          const gd = fgInstance.graphData();
          const match = (gd.nodes || []).find(n => n.community === cid);
          if (match && typeof match.x === 'number') fgInstance.centerAt(match.x, match.y, 600);
        }
      };
      leg.appendChild(item);
    });

    const qs = new URLSearchParams(window.location.search);
    if (qs.get('embed') === '1') {
      const bf = document.getElementById('btn-flow');
      const bc = document.getElementById('btn-chord');
      if (bf) bf.style.display = 'none';
      if (bc) bc.style.display = 'none';
    }
    const initMode = qs.get('mode') === 'chord' ? 'chord' : 'flow';
    if (initMode === 'chord') {
      setMode('chord');
    } else {
      renderFlow();
    }
  });
</script>
</body>
</html>
