<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graphify 3D Directory Tree</title>
<script src="../assets/3d-force-graph.min.js"></script>
<script>if (typeof ForceGraph3D === "undefined") { document.write('<script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"><\/script>'); }</script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #fff; font-family: sans-serif; overflow: hidden; }
  #3d-tree { width: 100vw; height: 100vh; }
  #hud { position: absolute; top: 14px; left: 14px; background: rgba(26, 26, 26, 0.86); backdrop-filter: blur(8px); border: 1px solid #232323; padding: 10px 14px; border-radius: 6px; font-size: 12px; color: #ececec; z-index: 10; font-weight: 600; }
  #legend { position: absolute; top: 54px; right: 14px; max-height: 70vh; overflow-y: auto; background: rgba(26, 26, 26, 0.86); backdrop-filter: blur(8px); border: 1px solid #232323; padding: 10px 12px; border-radius: 6px; font-size: 11px; z-index: 10; width: 200px; }
  #legend h3 { font-size: 10px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ececec; }
</style>
  <script src="live-reload.js"></script>
  <link rel="stylesheet" href="portal-theme.css?v=fp2">
  <script defer src="portal-ui.js?v=fp2"></script>
</head>
<body>
<div id="hud">🌲 3D Directory Tree (top-down DAG layout)</div>
<div id="legend"><h3>Communities</h3><div id="legend-list">Loading...</div></div>
<div id="3d-tree"></div>
<script>
  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [] };
  }

  // Build a parent->child DAG from each node's file path (deduplicated: many
  // symbol-nodes share one file) — same tree source as the 2D view (GRAPH_TREE.html).
  // Nodes with no source_file fall back to a bare id (no leading "/") — excluded
  // here, otherwise they poison the shared-prefix computation below.
  function buildDag(nodes) {
    const seen = new Set();
    const paths = [];
    const meta = {};
    for (const n of nodes) {
      if (!n.path || (!n.path.includes('/') && !n.path.includes('.')) || seen.has(n.path)) continue;
      seen.add(n.path);
      paths.push(n.path);
      meta[n.path] = { color: n.color, community: n.community };
    }
    if (paths.length === 0) return { nodes: [{ id: 'root', name: 'project', leaf: false }], links: [] };

    let prefix = paths[0];
    for (const p of paths) {
      let i = 0;
      while (i < prefix.length && i < p.length && prefix[i] === p[i]) i++;
      prefix = prefix.slice(0, i);
    }
    prefix = prefix.slice(0, prefix.lastIndexOf('/') + 1);

    const rootName = (window.PROJECT_CONFIG && window.PROJECT_CONFIG.projectName) || 'project';
    const dagNodes = new Map();
    const links = [];
    dagNodes.set('root', { id: 'root', name: rootName, leaf: false });
    for (const p of paths) {
      const rel = p.startsWith(prefix) ? p.slice(prefix.length) : p;
      const parts = rel.split('/').filter(Boolean);
      let parentId = 'root';
      let acc = '';
      parts.forEach((part, idx) => {
        acc += (acc ? '/' : '') + part;
        const id = acc;
        if (!dagNodes.has(id)) {
          const isLeaf = idx === parts.length - 1;
          dagNodes.set(id, {
            id, name: part, leaf: isLeaf,
            path: isLeaf ? p : undefined,
            color: isLeaf ? meta[p].color : undefined
          });
          links.push({ source: parentId, target: id });
        }
        parentId = id;
      });
    }
    return { nodes: Array.from(dagNodes.values()), links };
  }

  window.addEventListener('DOMContentLoaded', () => {
    const raw = getVizData();
    const labelsMap = raw.labels || window.GRAPH_LABELS || {};

    const commCounts = {};
    const commColor = {};
    (raw.nodes || []).forEach(n => {
      const cid = n.community || 0;
      commCounts[cid] = (commCounts[cid] || 0) + 1;
      if (!commColor[cid] && n.color) commColor[cid] = n.color;
    });
    const sortedCommIds = Object.keys(commCounts).map(Number).sort((a, b) => commCounts[b] - commCounts[a]);
    const legendList = document.getElementById('legend-list');
    legendList.innerHTML = '';
    sortedCommIds.slice(0, 20).forEach(cid => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${commColor[cid] || '#8b8b8b'};"></div><div class="legend-label">${labelsMap[cid] || `Community ${cid}`}</div>`;
      legendList.appendChild(item);
    });

    const { nodes, links } = buildDag(raw.nodes || []);
    document.getElementById('hud').textContent = `🌲 3D Directory Tree — ${nodes.length.toLocaleString()} entries`;

    ForceGraph3D({ rendererConfig: { alpha: true, antialias: true } })(document.getElementById('3d-tree'))
      .graphData({ nodes, links })
      .dagMode('td')
      .dagLevelDistance(60)
      .nodeLabel('name')
      .nodeColor(n => n.leaf ? (n.color || '#b4b4b4') : '#f59e0b')
      .nodeVal(n => n.leaf ? 2 : 4)
      .linkColor(() => 'rgba(255, 255, 255, 0.22)')
      .onNodeClick(node => {
        if (node.path && window.parent && typeof window.parent.loadFile === 'function') {
          window.parent.loadFile(node.path);
        }
      });
  });
</script>
</body>
</html>
