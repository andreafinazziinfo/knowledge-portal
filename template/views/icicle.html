<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icicle / Flamegraph — Hierarchical Architecture</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <script src="../data/graph_labels.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; }
    #ic-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #141414; border-bottom: 1px solid #262626; font-size: 12px; flex-shrink: 0; }
    #ic-crumb { color: #38bdf8; font-family: monospace; font-size: 11.5px; }
    #ic-reset { background: #262626; color: #fff; border: 1px solid #3a3a3a; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-left: auto; }
    #ic-reset:hover { border-color: #fff; }
    #ic-stage { flex: 1; width: 100%; min-height: 0; overflow: hidden; }
    #ic-tip { position: fixed; pointer-events: none; z-index: 40; display: none; background: #171717; border: 1px solid #404040; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #fff; }
  </style>
</head>
<body>
  <div id="ic-bar">
    <strong>Icicle / Flamegraph</strong>
    <span style="color:#9ca3af;">Click any bar to zoom in · Click file leaf to open in Reader</span>
    <span id="ic-crumb">/</span>
    <button id="ic-reset" type="button">Reset Root</button>
  </div>
  <div id="ic-stage"></div>
  <div id="ic-tip"></div>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const PALETTE = ['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#22d3ee','#f472b6','#a3e635','#fb923c','#818cf8','#2dd4bf','#facc15','#fb7185','#c084fc','#60a5fa'];
    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [] };
    const rootObj = { name: 'Codebase', children: [] };
    const fmap = new Map([['', rootObj]]);
    const seen = new Set();

    for (const n of (raw.nodes || [])) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      if (seen.has(p)) continue;
      seen.add(p);
      const parts = p.split('/').filter(Boolean);
      const col = n.color || PALETTE[Math.abs(n.community || 0) % PALETTE.length];
      let cur = '', parent = rootObj;
      for (let i = 0; i < parts.length; i++) {
        const seg = parts[i];
        const next = cur ? cur + '/' + seg : seg;
        if (i === parts.length - 1) {
          parent.children.push({ name: seg, path: p, value: Math.max(1, n.degree || 1), color: col });
        } else {
          if (!fmap.has(next)) {
            const f = { name: seg, children: [], color: col };
            fmap.set(next, f);
            parent.children.push(f);
          }
          parent = fmap.get(next);
        }
        cur = next;
      }
    }

    const stage = document.getElementById('ic-stage');
    const W = stage.clientWidth || window.innerWidth;
    const H = stage.clientHeight || (window.innerHeight - 44);
    const tip = document.getElementById('ic-tip');
    const crumb = document.getElementById('ic-crumb');

    const root = d3.hierarchy(rootObj).sum(d => d.value || 1).sort((a, b) => b.value - a.value);
    d3.partition().size([H, (root.height + 1) * (W / Math.min(6, root.height + 1))])(root);

    let focus = root;
    const svg = d3.select(stage).append('svg').attr('width', W).attr('height', H).attr('viewBox', `0 0 ${W} ${H}`);
    const cell = svg.selectAll('g').data(root.descendants()).join('g')
      .attr('transform', d => `translate(${d.y0},${d.x0})`)
      .style('cursor', 'pointer');

    const rect = cell.append('rect')
      .attr('width', d => Math.max(0, d.y1 - d.y0 - 1))
      .attr('height', d => Math.max(0, d.x1 - d.x0 - 1))
      .attr('fill', d => d.depth === 0 ? '#262626' : (d.data.color || '#38bdf8'))
      .attr('fill-opacity', d => d.children ? 0.65 : 0.85)
      .attr('rx', 2)
      .on('mousemove', (ev, d) => {
        tip.style.display = 'block'; tip.style.left = (ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY - 10) + 'px';
        tip.textContent = `${d.data.path || d.data.name} (weight: ${d.value})`;
      })
      .on('mouseleave', () => { tip.style.display = 'none'; })
      .on('click', (_, d) => {
        if (!d.children && d.data.path) {
          try { window.parent.postMessage({ action: 'openFile', path: d.data.path }, '*'); } catch (_) {}
          return;
        }
        zoomTo(focus === d ? (d.parent || root) : d);
      });

    const text = cell.append('text')
      .attr('x', 5).attr('y', 13)
      .attr('fill', '#ffffff').attr('font-size', '11px').attr('font-weight', '500')
      .attr('pointer-events', 'none')
      .text(d => d.data.name)
      .attr('fill-opacity', d => (d.x1 - d.x0) > 15 ? 1 : 0);

    function zoomTo(p) {
      focus = p;
      crumb.textContent = '/' + p.ancestors().map(a => a.data.name).reverse().slice(1).join('/');
      root.each(d => {
        d.target = {
          x0: (d.x0 - p.x0) / (p.x1 - p.x0) * H,
          x1: (d.x1 - p.x0) / (p.x1 - p.x0) * H,
          y0: d.y0 - p.y0,
          y1: d.y1 - p.y0,
        };
      });
      const t = cell.transition().duration(450).attr('transform', d => `translate(${d.target.y0},${d.target.x0})`);
      rect.transition(t).attr('height', d => Math.max(0, d.target.x1 - d.target.x0 - 1));
      text.transition(t).attr('fill-opacity', d => (d.target.x1 - d.target.x0) > 15 ? 1 : 0);
    }

    document.getElementById('ic-reset').onclick = () => zoomTo(root);
  })();
  </script>
</body>
</html>
