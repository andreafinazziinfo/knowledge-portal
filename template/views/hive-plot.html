<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hive Plot — Deterministic 3-Axis Topology</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    #hp-hud { position: absolute; top: 14px; left: 14px; z-index: 20; background: rgba(20,20,20,0.92); border: 1px solid #2b2b2b; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #d4d4d8; max-width: 380px; }
    #hp-hud strong { color: #fff; }
    #hp-tip { position: fixed; pointer-events: none; z-index: 40; display: none; background: #171717; border: 1px solid #404040; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #fff; }
  </style>
</head>
<body>
  <div id="hp-hud">
    <strong>Deterministic 3-Axis Hive Plot</strong><br>
    <span style="font-size:11px; color:#9ca3af;">Zero random layout · Axes: <span style="color:#38bdf8;">Core Hubs (In &gt; Out)</span> · <span style="color:#34d399;">Balanced Mid</span> · <span style="color:#fbbf24;">Leaf / Entrypoints (Out &gt; In)</span></span>
  </div>
  <div id="hp-stage"></div>
  <div id="hp-tip"></div>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [], edges: [] };
    const fMap = new Map(), id2f = new Map(), p2f = new Map(), s2f = new Map();
    for (const n of (raw.nodes || [])) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      const key = p.includes('/') || p.includes('.') ? p : String(n.id);
      if (!fMap.has(key)) fMap.set(key, { id: key, name: p.split('/').pop() || key, ind: 0, outd: 0 });
      id2f.set(String(n.id), key);
      const low = p.toLowerCase(); p2f.set(low, key); s2f.set(low.replace(/\.[^/.]+$/, ''), key);
    }
    function res(r) {
      const s = String(r || '');
      if (fMap.has(s)) return s;
      if (id2f.has(s)) return id2f.get(s);
      const low = s.replace(/\\/g, '/').toLowerCase();
      return p2f.get(low) || s2f.get(low.replace(/\.[^/.]+$/, '')) || null;
    }
    const edges = [];
    for (const e of (raw.edges || raw.links || [])) {
      const s = res(typeof e.source === 'object' ? e.source.id : e.source);
      const t = res(typeof e.target === 'object' ? e.target.id : e.target);
      if (s && t && s !== t) { edges.push([s, t]); fMap.get(s).outd++; fMap.get(t).ind++; }
    }

    const AXES = [
      { id: 0, name: 'Core Hubs (High Fan-In)', angle: -Math.PI / 2, color: '#38bdf8' },
      { id: 1, name: 'Balanced Mid-Layer', angle: Math.PI / 6, color: '#34d399' },
      { id: 2, name: 'Leaf / Entrypoints', angle: 5 * Math.PI / 6, color: '#fbbf24' },
    ];
    const active = Array.from(fMap.values()).filter(f => (f.ind + f.outd) > 0).sort((a, b) => (b.ind + b.outd) - (a.ind + a.outd)).slice(0, 150);
    const buckets = [[], [], []];
    for (const f of active) {
      const ax = f.ind > f.outd * 1.4 ? 0 : (f.outd > f.ind * 1.4 ? 2 : 1);
      f.axis = ax; buckets[ax].push(f);
    }
    const size = Math.min(window.innerWidth, window.innerHeight) - 30;
    const innerR = 45, outerR = size * 0.40;
    const pos = new Map();
    buckets.forEach((arr, ai) => {
      arr.sort((a, b) => (a.ind + a.outd) - (b.ind + b.outd));
      const ang = AXES[ai].angle;
      arr.forEach((f, idx) => {
        const r = innerR + (idx / Math.max(1, arr.length - 1)) * (outerR - innerR);
        pos.set(f.id, { x: Math.cos(ang) * r, y: Math.sin(ang) * r, f, r, ang });
      });
    });

    const svg = d3.select('#hp-stage').append('svg').attr('width', size).attr('height', size).attr('viewBox', `${-size/2} ${-size/2} ${size} ${size}`);
    const tip = document.getElementById('hp-tip');

    // Draw 3 axes
    AXES.forEach(ax => {
      svg.append('line').attr('x1', Math.cos(ax.angle)*innerR).attr('y1', Math.sin(ax.angle)*innerR)
        .attr('x2', Math.cos(ax.angle)*outerR).attr('y2', Math.sin(ax.angle)*outerR)
        .attr('stroke', ax.color).attr('stroke-width', 2).attr('stroke-opacity', 0.65);
      svg.append('text').attr('x', Math.cos(ax.angle)*(outerR+20)).attr('y', Math.sin(ax.angle)*(outerR+20))
        .attr('text-anchor', 'middle').attr('fill', ax.color).attr('font-size', 11).attr('font-weight', 700).text(ax.name);
    });

    const visEdges = edges.filter(([s, t]) => pos.has(s) && pos.has(t));
    const linkSel = svg.append('g').selectAll('path').data(visEdges).join('path')
      .attr('fill', 'none')
      .attr('d', ([s, t]) => {
        const a = pos.get(s), b = pos.get(t);
        return `M${a.x},${a.y} Q0,0 ${b.x},${b.y}`;
      })
      .attr('stroke', ([s]) => AXES[pos.get(s).f.axis].color).attr('stroke-opacity', 0.16).attr('stroke-width', 1);

    svg.append('g').selectAll('circle').data(Array.from(pos.values())).join('circle')
      .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => Math.min(7, Math.max(3, Math.sqrt(d.f.ind + d.f.outd))))
      .attr('fill', d => AXES[d.f.axis].color).attr('stroke', '#0f0f0f').style('cursor', 'pointer')
      .on('mouseenter', (ev, d) => {
        linkSel.attr('stroke-opacity', ([s, t]) => (s === d.f.id || t === d.f.id) ? 0.9 : 0.03)
          .attr('stroke-width', ([s, t]) => (s === d.f.id || t === d.f.id) ? 2 : 0.8);
        tip.style.display = 'block'; tip.style.left = (ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY - 10) + 'px';
        tip.innerHTML = `<strong>${d.f.id}</strong><br>In: ${d.f.ind} · Out: ${d.f.outd}`;
      })
      .on('mouseleave', () => { linkSel.attr('stroke-opacity', 0.16).attr('stroke-width', 1); tip.style.display = 'none'; })
      .on('click', (_, d) => { try { window.parent.postMessage({ action: 'openFile', path: d.f.id }, '*'); } catch (_) {} });
  })();
  </script>
</body>
</html>
