<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sankey Architecture Flow</title>
  <link rel="stylesheet" href="portal-theme.css?v=fp3">
  <script src="../assets/d3.v7.min.js"></script>
  <script src="../data/config.js"></script>
  <script src="../data/graph_viz.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
    #sk-hud {
      position: absolute; top: 14px; left: 14px; z-index: 20;
      background: rgba(20, 20, 20, 0.92); border: 1px solid #2b2b2b; border-radius: 10px;
      padding: 10px 14px; font-size: 12px; color: #d4d4d8;
    }
    #sk-hud strong { color: #ffffff; }
    #sk-stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 40px; }
    #sk-tip {
      position: fixed; pointer-events: none; z-index: 40; display: none;
      background: #171717; border: 1px solid #404040; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #fff;
    }
  </style>
</head>
<body>
  <div id="sk-hud">
    <strong>Sankey / Alluvial Architecture Flow</strong><br>
    <span style="font-size:11px; color:#9ca3af;">Cross-layer dependency volume across Presentation → API → Domain → Workers → Data</span>
  </div>
  <div id="sk-stage"></div>
  <div id="sk-tip"></div>
  <script src="portal-ui.js?v=fp4"></script>
  <script src="live-reload.js"></script>
  <script>
  (function () {
    const LAYERS = [
      { id: 0, name: 'Presentation / UI', color: '#38bdf8', match: /frontend|vue|\.tsx?$|\.jsx?$|store|component|view|ui|dashboard/i },
      { id: 1, name: 'API / Gateway', color: '#a855f7', match: /api|router|route|ws|websocket|endpoint|gateway|server/i },
      { id: 2, name: 'Domain / Services', color: '#34d399', match: /service|quant|engine|core|domain|logic|scanner|generator/i },
      { id: 3, name: 'Workers / CLI', color: '#fbbf24', match: /task|worker|celery|cli|script|watcher|job|beat/i },
      { id: 4, name: 'Data / DB / Infra', color: '#f87171', match: /sql|db|alembic|model|schema|redis|docker|infra|config|yaml/i },
    ];
    function layerOf(p) {
      for (const l of LAYERS) if (l.match.test(p)) return l.id;
      return 2;
    }

    const raw = window.GRAPH_VIZ || window.GRAPH_DATA || { nodes: [], edges: [] };
    const idToL = new Map(), pathToL = new Map(), stemToL = new Map();
    const counts = [0, 0, 0, 0, 0];
    const seenFiles = new Set();
    for (const n of (raw.nodes || [])) {
      const p = String(n.path || n.label || n.id).replace(/\\/g, '/');
      const lid = layerOf(p);
      idToL.set(String(n.id), lid);
      const low = p.toLowerCase();
      pathToL.set(low, lid);
      stemToL.set(low.replace(/\.[^/.]+$/, ''), lid);
      if (!seenFiles.has(low)) { seenFiles.add(low); counts[lid]++; }
    }
    function resL(r) {
      const s = String(r || '');
      if (idToL.has(s)) return idToL.get(s);
      const low = s.replace(/\\/g, '/').toLowerCase();
      if (pathToL.has(low)) return pathToL.get(low);
      if (stemToL.has(low.replace(/\.[^/.]+$/, ''))) return stemToL.get(low.replace(/\.[^/.]+$/, ''));
      return null;
    }

    const flowMat = Array.from({ length: 5 }, () => Array(5).fill(0));
    for (const e of (raw.edges || raw.links || [])) {
      const sl = resL(typeof e.source === 'object' ? e.source.id : e.source);
      const tl = resL(typeof e.target === 'object' ? e.target.id : e.target);
      if (sl !== null && tl !== null && sl !== tl) flowMat[sl][tl]++;
    }

    const W = Math.min(window.innerWidth - 40, 1120), H = Math.min(window.innerHeight - 90, 560);
    const svg = d3.select('#sk-stage').append('svg').attr('width', W).attr('height', H);
    const tip = document.getElementById('sk-tip');

    const padX = 70, colW = (W - padX * 2) / 4;
    const nodeW = 28;
    const maxCnt = Math.max(1, ...counts);
    const rects = LAYERS.map((l, i) => {
      const h = Math.max(48, Math.round((counts[i] / maxCnt) * (H - 140)));
      return { ...l, x: padX + i * colW - nodeW / 2, y: (H - h) / 2, h, count: counts[i] };
    });

    const maxFlow = Math.max(1, ...flowMat.flat());
    for (let i = 0; i < 5; i++) {
      for (let j = 0; j < 5; j++) {
        const v = flowMat[i][j];
        if (!v) continue;
        const a = rects[i], b = rects[j];
        const sw = Math.max(2, Math.min(34, (v / maxFlow) * 34));
        const x1 = a.x + (i < j ? nodeW : 0), y1 = a.y + a.h * 0.5;
        const x2 = b.x + (i < j ? 0 : nodeW), y2 = b.y + b.h * 0.5;
        const arcOff = (i < j ? -1 : 1) * (40 + Math.abs(j - i) * 38);
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + arcOff;
        svg.append('path')
          .attr('d', `M${x1},${y1} Q${mx},${my} ${x2},${y2}`)
          .attr('fill', 'none')
          .attr('stroke', i < j ? a.color : '#ef4444')
          .attr('stroke-opacity', 0.42)
          .attr('stroke-width', sw)
          .style('cursor', 'pointer')
          .on('mousemove', ev => {
            tip.style.display = 'block'; tip.style.left = (ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY - 10) + 'px';
            tip.innerHTML = `<strong>${a.name}</strong> → <strong>${b.name}</strong>: ${v} imports${i > j ? ' (upward dependency)' : ''}`;
          })
          .on('mouseleave', () => { tip.style.display = 'none'; });
      }
    }

    rects.forEach(r => {
      svg.append('rect').attr('x', r.x).attr('y', r.y).attr('width', nodeW).attr('height', r.h).attr('rx', 6).attr('fill', r.color);
      svg.append('text').attr('x', r.x + nodeW / 2).attr('y', r.y - 10).attr('text-anchor', 'middle').attr('fill', '#ffffff').attr('font-size', 12).attr('font-weight', 700).text(r.name);
      svg.append('text').attr('x', r.x + nodeW / 2).attr('y', r.y + r.h + 16).attr('text-anchor', 'middle').attr('fill', '#9ca3af').attr('font-size', 11).text(`${r.count} files`);
    });
  })();
  </script>
</body>
</html>
