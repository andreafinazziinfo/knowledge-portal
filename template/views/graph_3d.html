<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graphify 3D WebGL Network</title>
<script src="../assets/3d-force-graph.min.js"></script>
<script>if (typeof ForceGraph3D === "undefined") { document.write('<script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"><\/script>'); }</script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; height: 100vh; }
  #3d-graph { flex: 1; height: 100vh; }
  #hud { position: absolute; top: 14px; left: 14px; background: rgba(11, 16, 29, 0.85); backdrop-filter: blur(10px); border: 1px solid #1e293b; padding: 12px 16px; border-radius: 8px; font-size: 12px; color: #94a3b8; z-index: 10; pointer-events: none; }
  #hud strong { color: #38bdf8; font-size: 13px; display: block; margin-bottom: 2px; font-weight: 700; }
  #sidebar { width: 260px; background: rgba(11, 16, 29, 0.9); backdrop-filter: blur(10px); border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; padding: 14px; flex-shrink: 0; }
  #sidebar h3 { font-size: 11px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 2px; transition: background 0.15s; }
  .legend-item:hover { background: #1e293b; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }
</style>
  <script src="live-reload.js"></script>
</head>
<body>
<div id="hud">
  <strong>WebGL 3D GPU Knowledge Graph</strong>
  <span id="hud-stats">Loading 3D network...</span>
</div>
<div id="3d-graph"></div>
<div id="sidebar">
  <h3>Community Palette</h3>
  <div id="legend-list">Loading...</div>
</div>

<script>
  const COMMUNITY_COLORS = [
    "#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F", 
    "#EDC948", "#B07AA1", "#FF9DA7", "#9C755F", "#BAB0AC",
    "#38bdf8", "#fbbf24", "#f87171", "#34d399", "#a78bfa"
  ];

  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [], links: [] };
  }

  window.addEventListener('DOMContentLoaded', () => {
    const raw = getVizData();
    const labelsMap = raw.labels || (window.GRAPH_LABELS) || {};
    
    const commCounts = {};
    raw.nodes.forEach(n => { const cid = n.community || 0; commCounts[cid] = (commCounts[cid] || 0) + 1; });

    const legendList = document.getElementById('legend-list');
    legendList.innerHTML = '';
    const sortedCommIds = Object.keys(commCounts).map(Number).sort((a,b) => commCounts[b] - commCounts[a]);

    sortedCommIds.slice(0, 25).forEach(cid => {
      const color = COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
      const name = labelsMap[cid] || `Community ${cid}`;
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${color};"></div><div class="legend-label">${name}</div>`;
      legendList.appendChild(item);
    });

    // Spatial community nebulae positioning in 3D
    const nodes = (raw.nodes || []).map(n => {
      const cid = n.community || 0;
      const commIdx = sortedCommIds.indexOf(cid);
      const angle = (commIdx / Math.max(1, sortedCommIds.length)) * 2 * Math.PI;

      return {
        id: n.id,
        name: n.label,
        path: n.path,
        community: cid,
        color: n.color || COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length],
        val: Math.min(12, n.degree || 1),
        // Spatial 3D cluster position offset per community
        fx: Math.cos(angle) * 350 + (Math.random() - 0.5) * 180,
        fy: Math.sin(angle) * 350 + (Math.random() - 0.5) * 180,
        fz: (commIdx % 5 - 2) * 150 + (Math.random() - 0.5) * 180
      };
    });

    // CRITICAL: set linkOpacity to 0.12 with blue-cyan color so links are clearly visible without forming a white blob!
    const links = (raw.links || []).slice(0, 4000).map(l => ({
      source: l.source,
      target: l.target,
      color: 'rgba(56, 189, 248, 0.25)'
    }));

    document.getElementById('hud-stats').textContent = `${nodes.length.toLocaleString()} nodes in 3D WebGL • ${sortedCommIds.length} Community Nebulae`;

    ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData({ nodes, links })
      .nodeLabel('name')
      .nodeColor('color')
      .nodeVal('val')
      .linkColor('color')
      .linkOpacity(0.12)
      .onNodeClick(node => {
        if (window.parent && typeof window.parent.loadFile === 'function') {
          window.parent.loadFile(node.path);
        }
      });
  });
</script>
</body>
</html>
