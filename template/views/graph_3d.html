<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Portal — WebGL 3D GPU Knowledge Graph</title>
<script src="../assets/3d-force-graph.min.js"></script>
<script>
  if (typeof ForceGraph3D === "undefined") {
    document.write('<script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"><\/script>');
  }
</script>
<script src="../data/config.js"></script>
<script src="../data/graph_viz.js"></script>
<script src="../data/graph_labels.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #02040a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; height: 100vh; }
  #3d-graph { flex: 1; height: 100vh; }
  #hud {
    position: absolute; top: 14px; left: 14px;
    background: rgba(11, 16, 29, 0.88); backdrop-filter: blur(10px);
    border: 1px solid #1e293b; padding: 12px 16px; border-radius: 10px;
    font-size: 12px; color: #94a3b8; z-index: 10; pointer-events: auto;
  }
  #hud strong { color: #38bdf8; font-size: 13px; display: block; margin-bottom: 3px; font-weight: 700; }
  .hud-btns { display: flex; gap: 6px; margin-top: 8px; }
  .hud-btn {
    background: #0f172a; border: 1px solid #334155; color: #cbd5e1;
    padding: 5px 9px; border-radius: 6px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: color 0.15s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out;
  }
  .hud-btn:hover { border-color: #38bdf8; background: #1e293b; color: #fff; }
  .hud-btn.active-cycle { background: rgba(239, 68, 68, 0.25) !important; border-color: #ef4444 !important; color: #f87171 !important; }
  .hud-btn.active-orphan { background: rgba(245, 158, 11, 0.25) !important; border-color: #f59e0b !important; color: #fbbf24 !important; }

  #sidebar { width: 260px; background: rgba(11, 16, 29, 0.92); backdrop-filter: blur(10px); border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; padding: 14px; flex-shrink: 0; }
  #sidebar h3 { font-size: 11px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 700; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 2px; transition: background 0.15s; }
  .legend-item:hover { background: #1e293b; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }

  #inspector-card {
    display: none; position: absolute; bottom: 16px; left: 16px;
    background: rgba(11, 16, 29, 0.94); backdrop-filter: blur(12px);
    border: 1px solid #334155; border-radius: 10px; padding: 14px;
    width: 320px; z-index: 20; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  @media (max-width: 768px) {
    #sidebar { display: none; }
    #hud { top: 8px; left: 8px; right: 8px; font-size: 11px; padding: 8px 10px; }
    #3d-graph { width: 100vw !important; }
    #inspector-card { bottom: 8px; left: 8px; right: 8px; width: auto; }
  }
</style>
<script src="live-reload.js"></script>
  <link rel="stylesheet" href="portal-theme.css">
</head>
<body>
<div id="hud">
  <strong>🌐 WebGL 3D GPU Knowledge Graph</strong>
  <span id="hud-stats">Caricamento spazio 3D...</span>
  <div class="hud-btns">
    <button id="btn-3d-cycles" onclick="toggle3DCycles()" class="hud-btn" title="Rileva e illumina cicli in 3D">
      <span>🔴</span> Cicli
    </button>
    <button id="btn-3d-orphans" onclick="toggle3DOrphans()" class="hud-btn" title="Isola nodi orfani in 3D">
      <span>⚪</span> Orfani
    </button>
    <button id="btn-3d-reset" onclick="reset3DCamera()" class="hud-btn" title="Ripristina camera 3D">
      <span>↺</span> Reset Camera
    </button>
  </div>
</div>

<div id="3d-graph"></div>

<div id="sidebar">
  <h3>Community Palette (Cluster 3D)</h3>
  <div id="legend-list">Loading...</div>
</div>

<div id="inspector-card">
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
    <strong id="insp-name" style="color:#fff; font-size:13px; font-family:monospace; word-break:break-all;">-</strong>
    <button onclick="closeInspector()" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer; line-height:1;">&times;</button>
  </div>
  <div id="insp-path" style="font-size:11px; color:#64748b; margin-top:4px; font-family:monospace; word-break:break-all;">-</div>
  <div style="display:flex; gap:6px; margin-top:12px;">
    <button onclick="openCurrent3DNodeInReader()" style="flex:1; padding:7px 10px; background:#0284c7; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:11px; font-weight:600;">
      📖 Apri nel Reader
    </button>
    <button id="btn-3d-ego" onclick="toggle3DEgoNetwork()" style="flex:1; padding:7px 10px; background:#1e293b; color:#fff; border:1px solid #334155; border-radius:6px; cursor:pointer; font-size:11px; font-weight:600;">
      🎯 Isola Vicini
    </button>
  </div>
</div>

<script>
  const COMMUNITY_COLORS = [
    "#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F", 
    "#EDC948", "#B07AA1", "#FF9DA7", "#9C755F", "#BAB0AC",
    "#38bdf8", "#fbbf24", "#f87171", "#34d399", "#a78bfa"
  ];

  function getVizData() {
    return window.GRAPH_VIZ || (window.parent && window.parent.GRAPH_VIZ) || { nodes: [], links: [] };
  }

  let graphInstance = null;
  let rawNodes = [];
  let rawLinks = [];
  let currentSelected3DNode = null;
  let isEgoActive3D = false;
  let analyticsMode3D = null; // 'cycles' | 'orphans' | null

  window.addEventListener('DOMContentLoaded', () => {
    const raw = getVizData();
    const labelsMap = raw.labels || (window.GRAPH_LABELS) || {};
    
    const commCounts = {};
    (raw.nodes || []).forEach(n => { const cid = n.community || 0; commCounts[cid] = (commCounts[cid] || 0) + 1; });

    const legendList = document.getElementById('legend-list');
    legendList.innerHTML = '';
    const sortedCommIds = Object.keys(commCounts).map(Number).sort((a,b) => commCounts[b] - commCounts[a]);

    sortedCommIds.slice(0, 25).forEach(cid => {
      const color = COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
      const name = labelsMap[cid] || `Community ${cid}`;
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${color};"></div><div class="legend-label">${name}</div>`;
      item.onclick = () => focusCommunity(cid);
      legendList.appendChild(item);
    });

    rawNodes = (raw.nodes || []).map(n => {
      const cid = n.community || 0;
      const commIdx = sortedCommIds.indexOf(cid);
      const angle = (commIdx / Math.max(1, sortedCommIds.length)) * 2 * Math.PI;

      return {
        id: n.id,
        name: n.label,
        path: n.path,
        community: cid,
        color: n.color || COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length],
        origColor: n.color || COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length],
        val: Math.min(14, (n.degree || 1) * 1.2),
        origVal: Math.min(14, (n.degree || 1) * 1.2),
        fx: Math.cos(angle) * 350 + (Math.random() - 0.5) * 180,
        fy: Math.sin(angle) * 350 + (Math.random() - 0.5) * 180,
        fz: (commIdx % 5 - 2) * 150 + (Math.random() - 0.5) * 180
      };
    });

    const linksData = raw.links || raw.edges || [];
    rawLinks = linksData.slice(0, 5000).map(l => ({
      source: typeof l.source === 'object' ? l.source.id : l.source,
      target: typeof l.target === 'object' ? l.target.id : l.target,
      color: 'rgba(56, 189, 248, 0.25)',
      origColor: 'rgba(56, 189, 248, 0.25)'
    }));

    const _validNodeIds3D = new Set(rawNodes.map(n => n.id));
    rawLinks = rawLinks.filter(l => _validNodeIds3D.has(l.source) && _validNodeIds3D.has(l.target));

    document.getElementById('hud-stats').textContent = `${rawNodes.length.toLocaleString()} nodi WebGL 3D • ${sortedCommIds.length} Nebulose`;

    const elem = document.getElementById('3d-graph');
    graphInstance = ForceGraph3D()(elem)
      .graphData({ nodes: rawNodes, links: rawLinks })
      .nodeLabel('name')
      .nodeColor('color')
      .nodeVal('val')
      .linkColor('color')
      .linkOpacity(0.18)
      .onNodeClick(node => {
        currentSelected3DNode = node;
        // Camera smooth fly-to
        const distance = 140;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
        graphInstance.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          1000
        );
        showInspector(node);
      })
      .onBackgroundClick(() => {
        closeInspector();
      });
  });

  function showInspector(node) {
    document.getElementById('insp-name').textContent = node.name;
    document.getElementById('insp-path').textContent = node.path || '-';
    document.getElementById('btn-3d-ego').textContent = isEgoActive3D ? '↺ Mostra Tutti' : '🎯 Isola Vicini';
    document.getElementById('inspector-card').style.display = 'block';
  }

  function closeInspector() {
    document.getElementById('inspector-card').style.display = 'none';
    currentSelected3DNode = null;
  }

  function openCurrent3DNodeInReader() {
    if (!currentSelected3DNode || !currentSelected3DNode.path) return;
    const path = currentSelected3DNode.path;
    if (window.parent && typeof window.parent.loadFile === 'function') {
      window.parent.loadFile(path);
    } else {
      window.parent.postMessage({ action: 'openFile', path: path }, '*');
    }
  }

  function toggle3DEgoNetwork() {
    if (!currentSelected3DNode || !graphInstance) return;

    if (isEgoActive3D) {
      // Reset
      isEgoActive3D = false;
      graphInstance.graphData({ nodes: rawNodes, links: rawLinks });
      document.getElementById('btn-3d-ego').textContent = '🎯 Isola Vicini';
      return;
    }

    isEgoActive3D = true;
    const targetId = currentSelected3DNode.id;
    const neighborIds = new Set();
    neighborIds.add(targetId);

    const filteredLinks = rawLinks.filter(l => {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const dstId = typeof l.target === 'object' ? l.target.id : l.target;
      if (srcId === targetId) { neighborIds.add(dstId); return true; }
      if (dstId === targetId) { neighborIds.add(srcId); return true; }
      return false;
    });

    const filteredNodes = rawNodes.filter(n => neighborIds.has(n.id));
    graphInstance.graphData({ nodes: filteredNodes, links: filteredLinks });
    document.getElementById('btn-3d-ego').textContent = '↺ Mostra Tutti';
  }

  function reset3DCamera() {
    if (graphInstance) {
      isEgoActive3D = false;
      reset3DAnalytics();
      graphInstance.graphData({ nodes: rawNodes, links: rawLinks });
      graphInstance.cameraPosition({ x: 0, y: 0, z: 800 }, { x: 0, y: 0, z: 0 }, 1000);
      closeInspector();
    }
  }

  function focusCommunity(cid) {
    if (!graphInstance) return;
    const commNodes = rawNodes.filter(n => n.community === cid);
    if (!commNodes.length) return;
    const avgX = commNodes.reduce((acc, n) => acc + n.x, 0) / commNodes.length;
    const avgY = commNodes.reduce((acc, n) => acc + n.y, 0) / commNodes.length;
    const avgZ = commNodes.reduce((acc, n) => acc + n.z, 0) / commNodes.length;
    graphInstance.cameraPosition({ x: avgX * 1.5, y: avgY * 1.5, z: avgZ * 1.5 + 200 }, { x: avgX, y: avgY, z: avgZ }, 1000);
  }

  // ── 3D Cycles & Orphans Analytics Engine ──
  function toggle3DCycles() {
    if (analyticsMode3D === 'cycles') {
      reset3DAnalytics();
      return;
    }
    reset3DAnalytics();
    analyticsMode3D = 'cycles';
    document.getElementById('btn-3d-cycles').classList.add('active-cycle');

    const adj = new Map();
    rawNodes.forEach(n => adj.set(n.id, []));
    rawLinks.forEach(l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const dst = typeof l.target === 'object' ? l.target.id : l.target;
      if (adj.has(src)) adj.get(src).push(dst);
    });

    const visited = new Map();
    const cycleNodes = new Set();
    const recStack = new Set();

    function dfs(u) {
      visited.set(u, 1);
      recStack.add(u);
      for (const v of (adj.get(u) || [])) {
        if (!visited.has(v)) {
          if (dfs(v)) { cycleNodes.add(u); return true; }
        } else if (recStack.has(v)) {
          cycleNodes.add(u);
          cycleNodes.add(v);
          return true;
        }
      }
      recStack.delete(u);
      return false;
    }

    for (const n of rawNodes) {
      if (!visited.has(n.id)) dfs(n.id);
    }

    rawNodes.forEach(n => {
      if (cycleNodes.has(n.id)) {
        n.color = '#ef4444';
        n.val = n.origVal * 1.8;
      } else {
        n.color = 'rgba(255, 255, 255, 0.05)';
        n.val = n.origVal * 0.5;
      }
    });

    rawLinks.forEach(l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const dst = typeof l.target === 'object' ? l.target.id : l.target;
      if (cycleNodes.has(src) && cycleNodes.has(dst)) {
        l.color = '#ef4444';
      } else {
        l.color = 'rgba(255, 255, 255, 0.02)';
      }
    });

    graphInstance.nodeColor('color').linkColor('color');
    document.getElementById('hud-stats').textContent = `🔴 Rilevati ${cycleNodes.size} nodi in ciclo nel grafo 3D`;
  }

  function toggle3DOrphans() {
    if (analyticsMode3D === 'orphans') {
      reset3DAnalytics();
      return;
    }
    reset3DAnalytics();
    analyticsMode3D = 'orphans';
    document.getElementById('btn-3d-orphans').classList.add('active-orphan');

    const connectedNodes = new Set();
    rawLinks.forEach(l => {
      connectedNodes.add(typeof l.source === 'object' ? l.source.id : l.source);
      connectedNodes.add(typeof l.target === 'object' ? l.target.id : l.target);
    });

    let orphanCount = 0;
    rawNodes.forEach(n => {
      if (!connectedNodes.has(n.id)) {
        n.color = '#f59e0b';
        n.val = n.origVal * 1.5;
        orphanCount++;
      } else {
        n.color = 'rgba(255, 255, 255, 0.05)';
        n.val = n.origVal * 0.5;
      }
    });

    graphInstance.nodeColor('color');
    document.getElementById('hud-stats').textContent = `⚪ Individuati ${orphanCount} nodi orfani (isolati) in 3D`;
  }

  function reset3DAnalytics() {
    analyticsMode3D = null;
    document.getElementById('btn-3d-cycles').classList.remove('active-cycle');
    document.getElementById('btn-3d-orphans').classList.remove('active-orphan');
    rawNodes.forEach(n => {
      n.color = n.origColor;
      n.val = n.origVal;
    });
    rawLinks.forEach(l => {
      l.color = l.origColor;
    });
    if (graphInstance) {
      graphInstance.nodeColor('color').linkColor('color');
    }
  }
</script>
</body>
</html>
