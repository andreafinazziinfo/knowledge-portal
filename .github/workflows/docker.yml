name: Docker Publish GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  build-and-push:
    name: Build & Publish OCI Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Local Image for Smoke Test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: test-image:latest
      - name: Container Smoke Test
        run: |
          docker run -d --name test-portal -p 8000:8000 test-image:latest
          sleep 4
          curl -f http://localhost:8000/dashboard.html || exit 1
          curl -f http://localhost:8000/views/floorplan.html || exit 1
          curl -f http://localhost:8000/views/db-lineage.html || exit 1
          curl -f http://localhost:8000/data/views-manifest.json || exit 1
          docker stop test-portal
      - name: Build & Push Multi-Arch Image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
